[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasc-vllm-ascend-plugin"
version = "0.1.0"
description = "Opt-in DASC state-checkpoint monkeypatch for vLLM Ascend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "c1917797-bit" }]
dependencies = []

[project.entry-points."vllm.general_plugins"]
dasc_vllm_ascend = "dasc_vllm_ascend:register"

[tool.setuptools.packages.find]
include = ["dasc_vllm_ascend*"]

[tool.ruff]
line-length = 120
target-version = "py310"
