[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-prefix-ascend-plugin"
version = "0.2.0"
description = "Distribution-aware sparse exact-prefix checkpoints with atomic native-KV/GDN coexistence for vLLM-Ascend."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.entry-points."vllm.general_plugins"]
zz_sparse_prefix_ascend = "sparse_prefix_ascend:register"

[tool.setuptools.packages.find]
include = ["sparse_prefix_ascend*"]
