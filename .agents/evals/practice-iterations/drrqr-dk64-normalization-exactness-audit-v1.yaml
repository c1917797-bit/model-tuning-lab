audit_questions:
  - What exact load dtype, multiplication order, reduction tree, epsilon placement, reciprocal-square-root operation, rounding mode, and BF16 store boundary does the active path execute?
  - Which difference can explain first-step output and state divergence without a storage or metadata failure?
  - Can a supported CANN primitive reproduce that boundary across qualified SoCs and runtimes without hard-coded TP4 dimensions?
  - Does the proposed fold remove global materialization or launches after accounting for one Q/K head serving three value heads, or does it merely move the same work?
  - If exactness requires preserving the same materialized tensor and reduction launch, is the remaining seam too small to close the approximately 5.01 percent candidate gap?

portability_contract:
  algorithm_semantics: Keep logical Dk, selected-coordinate order, and normalization semantics independent of physical tiling and SoC dispatch.
  implementation: Derive shapes and head grouping from tensors, use supported backend primitives, version the opt-in operator, and retain the current separate l2norm plus recurrent fallback.
  evidence_boundary: Passing this audit is source and cost admission only; every implementation still requires per-environment NPU numerical, graph, endpoint, and final accuracy evidence.

current_result:
  outcome: rejected
  decision: The active Triton L2 path and failed AscendC Stage 2 are algebraically similar, but the observed bitwise contract depends on the Triton reduction tree, compiler lowering, math.rsqrt, FP fusion settings, and BF16 truncation. No supported portable CANN primitive was found that guarantees the same compiled reduction and rounding contract.
  active_ttir: /cache/cch/state-reduction-qwen38-drrqr-aligned-20260908/dk64-energy/preflight/dk64-normalization-exactness-audit-v1/l2norm_fwd_kernel2.ttir
  active_ttir_sha256: 34d8e2bbbafcd197cf91fdf1e1cacd230e06be766833bbc98c66e3ec45b71d56
  active_npubin_sha256: 5bf915acfcdb2a808435a08fe6602bceef1f6c0584ebe9ecb08c04b6b2b8c5d3
  target: Ascend910B4
  l2_ms_per_decode_step: 0.20184533333333335
  packed_front_ms_per_decode_step: 2.0461118333333332
  required_tpot_reduction_ms: 3.1816648009431248
  perfect_l2_throughput_ceiling_percent: 0.3035837051289958
  perfect_packed_front_throughput_ceiling_percent: 3.1652355531414544
  additional_recurrent_fraction_after_perfect_front_removal_percent: 61.88658167166044
  duplicate_work_audit: The active DrrqrPlan.transform_weights already index-selects retained Q/K projection rows and matching convolution rows before the original model loader and TP sharding; direct Dk64 slicing is not a new branch.
  claim_ceiling: Source, compiled-artifact, and optimistic cost rejection only. No new NPU, graph timing, endpoint performance, or accuracy result was produced.
  next_action: Admit a materially different DRRQR algorithm/state transformation only after proving it is not already implemented, improves held-out recurrent output rather than a state proxy alone, and has a credible Dk-specific path to at least the remaining approximately 3.182 ms per-token TPOT reduction.

