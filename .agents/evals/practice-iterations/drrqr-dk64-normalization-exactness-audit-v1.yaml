lessons_ingested:
  - lesson: A failed arithmetic gate changes the implementation decision immediately; the next iteration is a source/cost decision, not an automatic numerical retry.
    destination: .agents/skills/drrqr-ascend-optimization-loop/SKILL.md
    severity: high
  - lesson: If exact normalization cannot be folded with material savings, move to a larger DRRQR-specific Dk-dependent projection and state seam instead of accumulating launch-only optimizations.
    destination: projects/drror_vllm_ascend/docs/experiments/qwen38-drrqr-correctness-20260908/DRRQR_ASCEND_EXPERIENCE.md
    severity: high
  - lesson: Algebraic equivalence across Triton and AscendC is not a portable bitwise contract; compiler reduction and rounding behavior must be treated as part of the numerical boundary.
    destination: .agents/skills/drrqr-ascend-optimization-loop/SKILL.md
    severity: high
  - lesson: Before starting a planned optimization, prove that the active plugin does not already implement it and that perfect removal of the measured seam can materially close the endpoint gap.
    destination: .agents/skills/drrqr-ascend-optimization-loop/SKILL.md
    severity: high
