repository: model-tuning-lab
status: in_progress
date: 2026-09-12
validated_commit: pending

stage_goal: Decide from exact source and cost evidence whether a portable normalization primitive can replace the failed inline Stage 2 boundary without changing energy-Dk64 semantics or erasing its prospective gain.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 remains at 141.564496 output tok/s, 4.752041 percent above frozen dense and about 5.009887 percent below the fixed 10 percent target. The tested inline raw-Q/K normalization diverged at batch1 step1 and is stopped.
  medium_term_milestone: Produce a numerically defensible DRRQR decode candidate with a sufficiently large Dk-dependent compute or state-traffic reduction to justify one endpoint screen.
  short_term_decision: Determine whether the active l2norm arithmetic and BF16 materialization can be reproduced exactly with a portable CANN primitive inside the packed recurrent design at a credible cost; otherwise abandon this fusion boundary.
  deciding_evidence: A source-level operation-order and dtype-boundary comparison tied to exact commits and hashes, plus a head-multiplicity, UB, data-movement, and launch cost model against the existing separate l2norm path.
  budget_or_stop_rule: One source-and-cost audit only. Do not patch the operator, build, run NPU parity, profile, start a service, or run accuracy in this iteration.
  on_pass: Open a new implementation iteration with an independently named or versioned operator, a predeclared exact NPU gate, complete vendor-bundle identity, and an explicit portability dispatch contract.
  on_failure: Stop normalization fusion and open a direct aligned-Dk64 projection-weight slicing plus state-layout integration iteration that removes Dk-dependent upstream work while preserving a dense-prefill fallback and graph/cache identity.
  on_inconclusive: Run at most one source-only disambiguation if it can decide exactness or the material cost case; otherwise take the failure branch.

