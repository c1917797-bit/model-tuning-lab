validation_commands:
  - parse analyzer with Python AST without bytecode
  - synthetic rank-1 identity, orthogonality and lock checks in the pinned container
  - run the analyzer once into a fresh immutable output directory
  - verify fold-lock and report hashes
  - ./scripts/validate-mst.sh
  - git diff --check

lessons_ingested:
  - lesson: A select-one scalar merge is not the same representation as the best static rank-1 mixture across the three recurrent outputs; test the stronger necessary condition once.
    destination: oracle contract
    severity: high
  - lesson: Even an ideal post-value-source merge has only 2.645949 ms/token optimistic credit versus the 3.181665 ms/token gap, so passing cannot skip the early-dynamics foldability problem.
    destination: cost contract
    severity: high
