schema: mst-practice-iteration/v1
id: drrqr-uniform-dk80-endpoint-screen-v1
repository: model-tuning-lab
status: in_progress
date: 2026-09-10
validated_commit: pending

stage_goal: Admit or reject uniform energy-Dk80 as the next DRRQR performance-and-fidelity candidate using the exact frozen plan, candidate-only plugin geometry support, native Ascend correctness and one fixed-1024-token endpoint screen.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Uniform energy-Dk64 gains 4.752041 percent throughput but has unresolved task-quality loss. Full-layer native replay shows energy-Dk80 lowers aggregate post-RMS relative-L2 to 0.693278 of Dk64 while retaining a 37.5 percent state reduction, but Dk80 has no integrated endpoint result.
  medium_term_milestone: A concrete aligned DRRQR candidate with materially better fidelity than Dk64 and enough measured endpoint headroom for one candidate-specific Ascend fusion attempt.
  short_term_decision: Add only Dk80 and its TP4-local 2176 packed-convolution geometry to the plugin fail-closed allowlists, prove native and integrated execution, and measure one profiler-disabled endpoint screen.
  deciding_evidence: Require exact plan/source identities, all software gates, Dk128/Dk80 native multi-step eager and NPUGraph correctness, four-worker integrated Dk80 activation and fixed 40-request by 1024-output performance evidence. Promote only if throughput is at least 140 output tokens per second with finite TTFT/TPOT and no protocol drift.
  budget_or_stop_rule: One geometry-support implementation, one build/install, one native correctness matrix, one integrated service gate and one endpoint screen on physical NPU4-7. No parameter sweep, generic profiling, three-round performance, LongBench-v2 or GSM8K.
  on_pass: Capture one bounded Dk80 profile using the existing 4-rank/30-decode-step protocol and implement only a Dk80-relevant packed QKV, normalization, gating, recurrent or data-movement fusion with sufficient measured critical-path headroom.
  on_failure: Preserve and reject uniform Dk80 endpoint promotion; return to an exactly foldable coordinate/state algorithm rather than widening dimensions or running final accuracy.
  on_inconclusive: Repair only a demonstrated plan identity, geometry allowlist, build, service, orchestration or evidence-binding defect and rerun the affected gate once with unchanged thresholds.

candidate_contract:
  algorithm: Experimental joint normalized Q/K energy top-k DRRQR selector at uniform logical Dk80.
  paper_exact_selection: false
  old_head_k_dim: 128
  target_head_k_dim: 80
  persistent_state_ratio_vs_dense: 0.625
  qk_projection_ratio_vs_dense: 0.625
  physical_alignment: 16
  tp_size: 4
  tp_local_qkv_channels: 2176
  plan_path_host: /cache/cch/state-reduction-qwen38-drrqr-aligned-20260908/dk64-energy/preflight/aligned-width-plans-v1/dk80-energy-kernel.json
  plan_path_container: /drrqr-results/aligned-width-plans-v1/dk80-energy-kernel.json
  plan_sha256: 934ef84ddea2ab0544ac0146d1ab4c3a8fd47d53e97cde6222a3ac2b2ca648ae
  portability: Logical Dk80 is separated from physical alignment and packed-channel validation; unsupported backends fail closed or use the unchanged dense path, and only paired NPU measurements can establish speed on another environment.

