lessons_ingested:
  - lesson: A marginal optimistic endpoint ceiling must be followed by an exact output-projected held-out gate before structural implementation.
    destination: this iteration
    severity: high
  - lesson: A hard research deadline needs outcome routing at each gate so failure ends the branch instead of spawning nearby variants.
    destination: this iteration and .agents/HANDOFF.md after the result
    severity: high
  - lesson: A value-side compute ceiling is not an algorithm admission result. Reducing Dv changes the RMS denominator and removes out-projection support; require fit-locked exact-checkpoint projected-output and retained-post-RMS held-out gates before operator work.
    destination: .agents/skills/drrqr-ascend-optimization-loop/SKILL.md and DRRQR_ASCEND_EXPERIENCE.md
    severity: high
