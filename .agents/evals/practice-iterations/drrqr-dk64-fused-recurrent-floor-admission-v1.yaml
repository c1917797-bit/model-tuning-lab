schema: mst-practice-iteration/v1
id: drrqr-dk64-fused-recurrent-floor-admission-v1
repository: model-tuning-lab
status: complete
date: 2026-09-13
validated_commit: 42ac9d95b4b156f37cd42e8b1326072afa03d9d3

stage_goal: Decide whether correcting and extending the failed raw-packed-QKV Stage2 into a Dk64-specific QKV/L2/gating/recurrent operator can credibly close the frozen performance gap.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 still needs 3.181664712 ms/token of reciprocal-TPOT reduction to reach 148.656716909 output tok/s from 141.564496153.
  medium_term_milestone: Admit only a Dk64-specific operator whose surviving work and launch floor still leave enough optimistic endpoint headroom.
  short_term_decision: Identify the preserved Stage2 arithmetic defect, bind only source-removable profile kernels, and include a measured per-layer graph floor before spending another build or NPU run.
  deciding_evidence: Failed Stage2 source at commit 9dec2683c36bc6f44643d305e4ea2c75ff3eacee, the validated four-rank 30-step profile, and the existing order-balanced native/control/K64 micro-screen.
  budget_or_stop_rule: One source and measured-floor audit. Do not correct, build, or run the operator if even the deliberately optimistic known-removable plus recurrent-floor bound misses the fixed endpoint target.
  on_pass: Implement one correction for the proven arithmetic defect, require exact output/full-state eager and NPUGraph parity, then run one graph micro screen before service integration.
  on_failure: Preserve the identified bug but do not fix it for performance work; close this packed-fusion family and require a materially different DRRQR mechanism or explicit scope change.
  on_inconclusive: Permit one trace-shape or micro-report identity check only if it can change the bound.

candidate_contract:
  algorithm: Experimental joint normalized Q/K energy top-k selector at uniform logical Dk64.
  paper_exact_selection: false
  proposed_change: Consume raw packed QKV, reproduce active Q/K L2 semantics, optionally absorb gating, and retain one recurrent launch per GDN layer.
  prohibited_substitutes: [MTP, speculative decoding, quantization, retraining]

numerical_failure_audit:
  failed_commit: 9dec2683c36bc6f44643d305e4ea2c75ff3eacee
  result: proven_implementation_defect
  defect: NormalizeAndRoundQK calls Mul(input, input, input), destroying original signed Q/K values, then normalizes and BF16-round-trips the squared values instead of the original values.
  correction_shape: Compute squares into independent FP32 scratch, reduce them for the inverse norm, multiply the preserved original FP32 Q/K, then reproduce the BF16 round trip before recurrent arithmetic.
  claim_boundary: This explains the first-step output and full-state divergence. It does not prove that the corrected AscendC reduction will be bitwise equal or faster.

