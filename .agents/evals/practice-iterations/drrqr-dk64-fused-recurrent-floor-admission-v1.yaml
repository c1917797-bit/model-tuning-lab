    - {label: control_b2, sha256: 6a09cf48d1e7b11cbd3a39f9f20b7a8e61919a842870fc0653d5a6980a9a4df4}
    - {label: native_a2, sha256: 28b8401415ce5118e1973afc08253e73d7be26c4b7c81bfec4d631a2a6704e01}
  fastest_observed_graph_sample_per_layer_ms: 0.013608600
