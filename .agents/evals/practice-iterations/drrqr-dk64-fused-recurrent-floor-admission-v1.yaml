optimistic_endpoint_bound:
  required_tpot_reduction_ms: 3.181664712
  known_external_credit_plus_recurrent_to_floor_ms: 2.865003871
  shortfall_without_optional_qkvz_ms: 0.316660840
  all_known_external_plus_optional_qkvz_plus_recurrent_to_floor_ms: 3.004914038
  shortfall_even_with_optional_qkvz_ms: 0.176750674
  required_residual_recurrent_per_layer_without_optional_qkvz_us: 7.011499
  required_residual_recurrent_per_layer_with_optional_qkvz_us: 9.926294
  comparison: Both required residuals are below the fastest observed 13.608600 us graph sample, before charging fused normalization, gating, FP32 state, or added raw-layout work.

validation_commands:
  - Inspect the failed Stage2 header at commit 9dec2683 and the frozen active L2 semantics.
  - Recompute source-bound per-step costs from the validated profile.
  - Inspect all six immutable ABCCBA micro reports and use the fastest individual graph sample as the optimistic per-layer floor.
  - ./scripts/validate-mst.sh
  - git diff --check

outcome:
  class: rejected_before_correction
  evidence_level: source root cause plus target-runtime profile and measured graph floor
  decision: Do not correct or extend Stage2 for endpoint work. The numerical defect is real and repairable in principle, but the surviving one-launch-per-layer recurrent floor makes the fixed 10 percent target unreachable even under an overgenerous removal bound.
  claim_ceiling: Rejects this per-layer packed QKV/L2/gating/recurrent fusion family as the remaining route to the fixed target. It does not prove that every future cross-layer or algorithmically different DRRQR formulation is impossible.
  code_changed: false
  npu_used: false
  endpoint_used: false
  accuracy_used: false

lessons_ingested:
  - A proven numerical bug does not justify a correction run when an independent performance floor already rejects the mechanism.
  - Perfect-removal bounds must retain irreducible per-layer launches and arithmetic rather than treating the entire recurrent kernel as removable.
  - Use the fastest compatible observed sample and favorable dtype as an optimistic floor; failure under that bound is stronger than failure under an average estimate.
