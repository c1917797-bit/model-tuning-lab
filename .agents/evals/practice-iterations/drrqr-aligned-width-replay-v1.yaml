schema: mst-practice-iteration/v1
id: drrqr-aligned-width-replay-v1
repository: model-tuning-lab
status: in_progress
date: 2026-09-09
validated_commit: pending

stage_goal: Determine whether aligned Dk48 and Dk80 provide a stable real-teacher fidelity curve that justifies full-layer sensitivity capture and a portable mixed-width DRRQR candidate.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Uniform energy-Dk64 has only a 4.752041 percent endpoint screen and historical task-quality loss; fixed retained-key beta improved the global local-fidelity mean but failed five frozen group-window gates and is rejected for model integration.
  medium_term_milestone: A numerically defensible aligned-width DRRQR candidate whose fidelity-versus-state-cost curve justifies full-layer capture and mixed-Dk runtime work before any task-accuracy test.
  short_term_decision: Generate immutable energy-kernel Dk48 and Dk80 plans from the frozen calibration and replay uniform48, uniform64 and uniform80 against the existing six-layer dense teacher.
  deciding_evidence: All new widths must pass native eager and NPUGraph state/output gates; Dk80 must improve the global post-RMS relative-L2 mean by at least 15 percent versus Dk64 with no layer-rank-sequence window worsening beyond 5 percent, while Dk48 establishes the lower-cost side of a monotonic aggregate fidelity curve.
  budget_or_stop_rule: One plan-generation and software-test stage plus one combined NPU replay on physical NPU4 within 1800 seconds; no model service, endpoint benchmark, accuracy run, automatic retry, or mixed-cache implementation in this iteration.
  on_pass: Capture all 48 linear-attention layers with the frozen dense teacher protocol, solve an aligned layerwise dimension budget using real trajectory sensitivity plus cost, and only then implement the selected portable cache/runtime contract.
  on_failure: Reject simple width-only layer allocation for the current energy selector and return to DRRQR selector or recurrence-compensation design using the preserved real teacher evidence.
  on_inconclusive: Preserve the result and repair only a demonstrated execution, plan-identity, or evidence-binding defect within the same bounded protocol.

changes:
  - type: validation
    description: Extend immutable energy-kernel plan preparation to aligned Dk48 and Dk80 and bind their provenance.
    files:
      - projects/drror_vllm_ascend/drror_vllm_ascend/prepare.py
      - projects/drror_vllm_ascend/tests/test_contracts.py
  - type: validation
    description: Add a captured-teacher width-curve replay reusing frozen runtime helpers without changing historical reports.
    files:
      - projects/drror_vllm_ascend/tools/replay_gdn_teacher_width_curve.py
      - projects/drror_vllm_ascend/tests/test_replay_gdn_teacher_width_curve.py

validation_commands:
  - python3 -m pytest projects/drror_vllm_ascend/tests/test_contracts.py projects/drror_vllm_ascend/tests/test_replay_gdn_teacher_width_curve.py
  - ./scripts/validate-mst.sh
  - git diff --check
  - one predeclared physical-NPU4 replay in the existing audited dedicated container

