schema: mst-practice-iteration/v1
id: drrqr-tail-dot-recurrent-compensation-v1
repository: model-tuning-lab
status: rejected
date: 2026-09-10
validated_commit: pending

stage_goal: Determine whether a fixed 16-dimensional sketch of discarded Q/K coordinates can restore the instantaneous recurrent update direction enough to improve energy-Dk64 decode fidelity while preserving a credible Ascend speed path.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 provides 4.752041 percent endpoint gain but has unresolved accuracy loss. DPDT improved state fidelity by 59.985923 percent while worsening decode post-RMS fidelity by 2.183104 percent, proving that state-only correction is insufficient.
  medium_term_milestone: Produce a numerically admitted Dk64 recurrent candidate whose correction can be statically folded into projections and fused without restoring dense recurrent state.
  short_term_decision: Compare frozen energy-Dk64 against one analytic, non-fitted tail-dot correction over development captures 0-11.
  deciding_evidence: Require at least 15 percent lower aggregate decode post-RMS relative-L2, non-worse aggregate prefill post-RMS, bitwise-identical recurrent state to energy-Dk64, at least 72 of 96 layer/rank/head groups non-worse, no group worse by more than 5 percent, finite outputs, exact baseline-plan identity and static cost gates.
  budget_or_stop_rule: One implementation and one frozen CPU replay. No parameter sweep, fitting, captures 12-15, NPU use, integration, endpoint benchmark or task accuracy.
  on_pass: Freeze the transform and correction contract, collect a new untouched admission capture, then validate an opt-in plugin implementation on native Ascend before a fixed-1024-token endpoint screen.
  on_failure: Preserve and reject the analytic tail-dot correction without weakening gates; use the headwise failures to decide whether a bounded historical-state sketch is justified.
  on_inconclusive: Fix only a demonstrated implementation, metric-window, identity or arithmetic defect and rerun once with unchanged gates.

algorithm_contract:
  name: Tail-Dot Recurrent Compensation
  abbreviation: TDRC
  recurrent_coordinates: Frozen energy-Dk64 coordinates.
  tail_coordinates: All 64 discarded local coordinates.
  tail_transform: Fixed 64-by-16 signed Walsh-Hadamard orthoprojector scaled by sqrt(64/16), deterministically keyed by layer, rank and key head; no data fitting.
  recurrence:
    persistent_state_width: 64
    state_update: Exactly the existing energy-Dk64 update.
    correction: Add beta times the Dk64 residual times the difference between sketched 128-width and Dk64 normalized q-dot-k coefficients.
    correction_scope: Operator output only; never feed the correction into recurrent state.
  arithmetic_reference: FP32 recurrence and correction with the same BF16 output boundary as the existing replay.
  portability: The transform is mathematical and statically foldable into Q/K projection weights; it contains no chip addresses, timing constants or private runtime replacement.

ascend_cost_contract:
  persistent_state_ratio_vs_dense: 0.5
  qk_projection_width_ratio_vs_dense: 0.625
  recurrent_width: 64
  tail_sketch_width: 16
  alignment: Both recurrent and tail widths are multiples of 16.
  extra_decode_work: One 16-element dot/norm estimate plus one value-width residual axpy per token; target implementation must fuse this with the DRRQR decode path.
  generic_dense_optimization: Any non-candidate-specific optimization must also be applied to dense.
  claim_boundary: Passing CPU replay is numerical admission only and cannot establish NPU throughput, task accuracy or cross-environment speedup.

