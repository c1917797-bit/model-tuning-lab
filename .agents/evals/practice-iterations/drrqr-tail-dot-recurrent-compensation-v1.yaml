  decision: Reject TDRC v1. Do not tune the sketch seed or width and do not admit it to NPU replay, integration, endpoint benchmarking or task accuracy.
validation_commands:
  - focused tests for transform geometry, determinism, state identity, correction formula and fail-closed plan geometry
  - full project software test suite
  - one CPU replay over development indices 0-11
  - independent report audit
  - ./scripts/validate-mst.sh
  - git diff --check

lessons_ingested:
  - The output metric, not a state proxy, is the deciding numerical target.
  - A correction must retain the Dk64 persistent-state saving and expose a static projection/fusion path.
  - No teacher fitting, LoRA, distillation or prompt-specific parameter search is allowed in this iteration.
  - Restoring only an estimate of the current-token tail q-dot-k coefficient does not repair energy-Dk64 output fidelity even when recurrent state is bitwise unchanged.
  - The dominant missing term is more consistent with historical reads from discarded state columns than with the instantaneous self-update coefficient.
  - Any next correction must represent historical tail state explicitly under a bounded aligned state and projection budget; do not retry tail-dot seed or width variants.
