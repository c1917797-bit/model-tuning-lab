lessons_ingested:
  - lesson: A hard wall-clock timeout is inconclusive evidence even when it occurs inside a candidate trajectory; do not map exception location to algorithm failure.
    destination: .agents/skills/ascend-inference-tuning-loop/SKILL.md
    severity: high
  - lesson: Once a complete dense semantic replay is hash-bound, bounded candidate shards can reuse that scoped gate without rerunning dense or weakening candidate numerical checks.
    destination: .agents/skills/ascend-benchmark-evidence/SKILL.md
    severity: medium
  - lesson: A monotonic lower/current/higher width curve does not establish a feasible heterogeneous budget; each lower-cost layer must pass the local regression gate before it can pay for a higher-cost layer.
    destination: .agents/skills/ascend-canary-implementation/SKILL.md
    severity: high
