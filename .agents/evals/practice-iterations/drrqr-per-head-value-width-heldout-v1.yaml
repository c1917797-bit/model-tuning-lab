validation_commands:
  - parse analyzer with the Python AST without creating bytecode
  - run analyzer in the existing pinned container into a fresh immutable output directory
  - verify report and fit-lock hashes plus every predeclared gate
  - ./scripts/validate-mst.sh
  - git diff --check

lessons_ingested:
  - lesson: Per-head robustness metrics do not test per-head selection; distinguish evaluation granularity from selector granularity before declaring a class exhausted.
    destination: this iteration
    severity: high
  - lesson: Add only the minimum new degree of freedom needed to test the hypothesis. Keeping one scalar per layer makes any change attributable to per-head coordinates.
    destination: candidate contract
    severity: high
  - lesson: More selector granularity is not automatically more faithful. The per-head score optimized individual coordinate energy times output-column norm but ignored cross-column cancellation; both fit and held-out projected error stayed above four times the Dk64 baseline error.
    destination: .agents/skills/drrqr-ascend-optimization-loop/SKILL.md
    severity: high
  - lesson: When layer-shared and per-head static coordinate plans both fail the same untouched downstream gates by multiples, close the nearby coordinate/gain family before NPU rather than continuing selector search.
    destination: .agents/HANDOFF.md
    severity: high
