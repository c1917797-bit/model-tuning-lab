  official_selector_runtime_finding: At fixed Dk, official StrongRRQR selects Q and K projection and convolution rows and updates head_k_dim; it changes coordinate identity, not runtime tensor shape or work relative to another selector at the same Dk.
  official_recovery_finding: The README places LoRA after pruning to recover performance. Both LoRA launchers enable LoRA and teacher-model distillation; this is outside the current no-training boundary.
  remaining_mechanism_finding: No untested named no-training representation remains with both a non-overlapping target-crossing cost case and a credible untouched downstream-output fidelity case.
  decision: Do not start another nearby selector, state/value compression, cache, fusion repair, operator build, NPU endpoint or final accuracy run. Reopening requires explicit authorization for training-based recovery or a genuinely new model/algorithm scope with fresh gates.
  claim_ceiling: Current Qwen3.8 same-stack no-training program only; not a universal impossibility result for DRRQR, other models, training regimes, ranks, Ascend generations or software stacks.

lessons_ingested:
  - lesson: A bounded program needs an explicit scope-decision iteration when all nearby mechanism families are closed; do not turn absence of a credible candidate into another empirical sweep.
    destination: drrqr-ascend-optimization-loop
    severity: high
  - lesson: If the official paper workflow recovers a structurally pruned model with LoRA and teacher distillation, a no-training no-loss target is a stronger program. Coordinate-only StrongRRQR at fixed Dk cannot add runtime headroom; after all distinct untrained representations fail downstream gates, require a scope decision instead of more selector or operator variants.
    destination: drrqr-ascend-optimization-loop
    severity: high

