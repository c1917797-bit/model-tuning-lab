resource_contract:
  physical_npus: [4, 5, 6, 7]
  container_npus: [0, 1, 2, 3]
  container: drrqr_qwen38_energy_preflight_20260908
  output_policy: Fresh paths only; preserve prior serial and concurrent evidence and never relax finite-output checks.

