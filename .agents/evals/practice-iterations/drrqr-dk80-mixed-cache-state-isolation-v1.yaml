validation_commands:
  - focused tests for bounded repeated tracing, phase/state identity and all-future receipt retention
  - full project software test suite
  - ./scripts/validate-mst.sh
  - git diff --check
  - one exact-plan four-worker activation gate
  - one frozen 16-request mixed cohort with no retry

portability_contract:
  algorithm_semantics: Logical Dk80 selection and recurrence remain separate from physical padding, cache block size and operator tiling.
  backend_dispatch: A correction must capability-check the cache/operator ABI, be independently named and explicitly opted in, and preserve a mathematically matching fallback or fail closed.
  evidence_limit: A result on 910B4 and v0.23 is environment-specific until another environment passes its own NPU numerical and paired endpoint gates.

lessons_ingested:
  - lesson: Protocol-faithful anomaly localization must retain the concurrency, scheduler phase, cache occupancy and prompt cohort of the failure being explained.
    destination: projects/drror_vllm_ascend/AGENTS.md
    severity: critical
