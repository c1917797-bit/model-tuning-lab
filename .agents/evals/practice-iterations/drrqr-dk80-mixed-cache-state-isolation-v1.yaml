runtime_checkpoint:
  state: completed_and_cleaned
  observed_at: 2026-09-11
  evidence: The foreign TP8 service released the devices. Fresh preflights proved that the dedicated container maps physical NPU4-7 to container NPU0-3, all four devices were idle, and the container contained only its persistent bash before launch. The bounded 0.1.17 service and cohort completed, the exact service process was stopped, and the postcheck again found no NPU process and only the persistent bash.
  decision: The diagnostic budget is exhausted; do not restart or broaden this mixed-MC2 investigation.

outcome:
  classification: accepted_diagnostic
  candidate_decision: Dk80 is not admitted to endpoint performance with mixed MC2 enabled; this run does not reject the Dk80 algorithm under a different valid common path.
  request_result: 10 of 16 requests returned HTTP 200 and 6 failed NaN serialization, reproducing the 0.1.15 outcome.
  localization: All four workers first observed a non-finite value at diagnostic call 7, language_model.model.layers.3.self_attn.o_proj. The one-row decode input was non-finite while the 32768-row prefill input, decode output, prefill output and prior layer-2 MLP MC2 boundary were finite.
  interpretation: The first bound non-finite value is inside the full-attention decode branch before o_proj, not in Dk80 recurrent state/cache ownership and not first inside the fused prefill suffix. Mixed-off Dk80 returned 16 of 16 successes, so mixed MC2 remains causally associated but its exact mechanism is outside the DRRQR candidate-specific state/operator seam.
  claim_ceiling: Integrated mixed-scheduler anomaly localization only; no throughput, task accuracy, kernel-speed, or cross-environment claim.
  evidence_sha256: 805cd19839d1d4c2aa3692df9d023d700287122397088869409c9611aaacce0e
  cohort_sha256: 8b3efc3a3742515e27ffdd0cb1b1b00d458e572bf9fb1c6e6a23a217607a43be
  service_manifest_sha256: 62f9d5e600e8463438376e9b5ded835a4c82e69047d4f42080cf9a4984ba074b
  wheel_sha256: 17e41c5807b20139cf192ac761af4881c713c8281947ff36d972a1831b088e13
  next_decision: Return to the admitted energy-Dk64 DRRQR candidate and perform the independently named plugin-owned native decode layout control already specified in NATIVE_DECODE_PROTOTYPE_SEAMS.md; do not make mixed MC2 or Dk80 cache diagnostics the mainline.

