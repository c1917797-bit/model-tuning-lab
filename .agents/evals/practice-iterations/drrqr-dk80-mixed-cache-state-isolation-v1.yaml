stage_goal: Bind the prior Dk80 concurrent endpoint NaN to either real cache-state ownership, mixed-prefill/decode GDN arithmetic, or a later output seam before changing the algorithm or Ascend operator.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 gains only 4.752041 percent; Dk80 passes short native gates and one complete serial 32768-token prefill trace, but the protocol-faithful 16-concurrent endpoint gate previously produced 13 NaN serialization failures.
  medium_term_milestone: A numerically valid Dk80 DRRQR candidate with a proven candidate-specific Ascend implementation seam, or a defensible rejection that redirects algorithm design.
  short_term_decision: Determine whether the first non-finite value under the original mixed scheduler regime occurs in Dk80 state-cache ownership/lifecycle, within GDN prefill/decode arithmetic, or only after GDN.
  deciding_evidence: Re-run the frozen 16-prompt, concurrency-16, input32768/output16 cohort once with lightweight request-preserving receipts and bounded GDN diagnostics that record phase, cache indices, state storage pointer/offset/shape/stride and finite counts until the first non-finite boundary on each worker.
  budget_or_stop_rule: One diagnostic implementation/build, one four-worker service and one frozen 16-request cohort on physical NPU4-7. No retry, width or seed sweep, profiler, performance acceptance, or task accuracy.
  on_pass: If non-finite state coincides with overlapping or incorrect cache ownership, implement a Dk80-specific cache-layout/indexing correction with bitwise storage and multi-step NPU gates; if finite inputs first become non-finite inside a named GDN operator, design an explicitly opted-in plugin-owned adapter with a portable mathematical fallback.
  on_failure: If cache ownership and every GDN boundary remain finite while downstream output becomes non-finite, reject cache/prefill-operator adaptation and bind at most one model-output or logprob seam.
  on_inconclusive: Preserve the run, reject further diagnostic expansion for Dk80, and return to a materially different exactly foldable DRRQR algorithm/state design.

