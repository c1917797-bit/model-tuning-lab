schema: mst-practice-iteration/v1
id: drrqr-dk64-fp32-inplace-state-cache-admission-v1
repository: model-tuning-lab
status: complete
date: 2026-09-13
validated_commit: 17454029d743ad3469ef1d088f382850789e29a7

stage_goal: Decide whether a plugin-owned FP32 in-place recurrent-state cache/update adaptation is a new DRRQR-specific mechanism with enough measured headroom to reopen implementation.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Frozen dense is 135.142469917 output tok/s, the fixed target is 148.656716909, and energy-Dk64 is 141.564496153 with TPOT 66.689383571 ms. Under reciprocal-throughput admission it still needs 3.181664712 ms/token of TPOT reduction.
  medium_term_milestone: Admit only a materially different DRRQR mechanism whose source identity and deliberately optimistic endpoint ceiling can close a material part of the open gap.
  short_term_decision: Bind the actual v0.23 Ascend pure-decode state mutation contract and the Slice/Concat profile shapes before writing code or using an NPU.
  deciding_evidence: Frozen source/schema identity plus the existing validated four-rank, 30-step decode profile.
  budget_or_stop_rule: One source/profile audit. Stop without code, build, NPU, service, endpoint, or accuracy work if recurrent state is already updated in place or if the claimed profile kernels are not state-cache transfers.
  on_pass: Open one plugin-local exact-state implementation and target-NPU numerical gate.
  on_failure: Preserve the duplicate-mechanism evidence and require another materially different named DRRQR algorithm/state mechanism before reopening.
  on_inconclusive: Permit one caller-to-kernel trace disambiguation only if it can change the admission decision.

candidate_contract:
  algorithm: Experimental joint normalized Q/K energy top-k selector at uniform logical Dk64.
  paper_exact_selection: false
  proposed_change: Preserve the real FP32 recurrent-state semantics while making state update/storage in place.
  prohibited_substitutes: [MTP, speculative decoding, quantization, retraining]

