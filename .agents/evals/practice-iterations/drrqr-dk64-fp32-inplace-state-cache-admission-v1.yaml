findings:
  active_state_path:
    result: already_in_place
    evidence:
      - The torch schema declares recurrent state as Tensor(a!), a mutable alias.
      - Pure decode passes the cache tensor directly as state=ssm_state to npu_recurrent_gated_delta_rule.
      - The native adapter calls aclnnRecurrentGatedDeltaRule with that state; pure decode has no state gather, concatenate, returned-state allocation, or scatter-back boundary.
      - Prefill indexing and last-state scatter are not part of the validated 30-step pure-decode profile and cannot be credited to decode TPOT.
  slice_concat_binding:
    result: qkv_layout_not_state_cache
    evidence:
      - One Slice per layer/step has input shape 16x3584 and is the QKVZ split.
      - Three Slice calls per layer/step have input shape 16x2048 and are the Q/K/V split.
      - One ConcatD per layer/step has flattened Q/K/V input shapes 4096, 4096, and 24576.
      - None has the FP32 recurrent-state geometry with local shape slots x 12 x 128 x 64.
  capacity_only_cache_route:
    result: no_decode_compute_saving
    evidence:
      - Compact request-state allocation can change capacity and index ownership but not the native per-active-request recurrent state read/update/write.
      - The already-tested concurrency-32 endpoint configuration did not improve throughput, so capacity alone is not a measured route to the fixed target.

optimistic_ceiling:
  required_tpot_reduction_ms: 3.181664712
  admitted_state_copy_credit_ms: 0.0
  reason: The proposed FP32 in-place state mutation is already active.
  deliberately_overgenerous_all_slice_concat_credit_ms: 1.826090500
  overgenerous_shortfall_ms: 1.355574212
  warning: The overgenerous figure wrongly treats every profiled Slice and ConcatD kernel as removable, state-related, and fully critical-path. It is retained only as a stronger rejection bound; kernel sums are not an endpoint forecast.

validation_commands:
  - Read the exact v0.23 gdn.py pure-decode caller, torch mutation schema, and recurrent torch adapter.
  - Bind validated four-rank decode Slice and ConcatD records by input shape and per-layer call count.
  - ./scripts/validate-mst.sh
  - git diff --check

outcome:
  class: rejected_before_implementation
  evidence_level: source identity plus existing target-runtime diagnostic profile
  decision: Do not implement, build, or run an FP32 in-place state-cache operator. It duplicates the active mutation contract, and the profile kernels initially considered as state movement are QKV layout operations already owned by the previously tested packed-QKV fusion family.
  claim_ceiling: Rejects only the proposed FP32 in-place state-cache/update mechanism as a new performance candidate. It does not reject a materially different DRRQR algorithm/state formulation.
  npu_used: false
  endpoint_used: false
  accuracy_used: false

lessons_ingested:
  - Prove mutation and aliasing from the active torch schema and caller before proposing an in-place cache operator.
  - Bind profiler kernels to tensor shapes and call-site multiplicity; never relabel QKV Slice/Concat traffic as recurrent-state traffic.
  - A compact allocator is a capacity mechanism until it proves a per-token compute or memory-traffic change on the fixed workload.
