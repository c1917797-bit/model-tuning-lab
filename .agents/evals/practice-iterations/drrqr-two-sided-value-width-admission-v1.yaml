lessons_ingested:
  - lesson: Derive TP-local packed widths symbolically from Q, K, V and Z components before turning profile shares into a ceiling; a small denominator mistake can reverse a marginal admission decision.
    destination: this iteration and analyzer arithmetic assertions
    severity: high
  - lesson: A theoretical ceiling only admits the next cheap fidelity gate. Dv64 retains 0.810046 percentage points of optimistic margin and therefore does not justify implementation by itself.
    destination: .agents/HANDOFF.md
    severity: high
  - lesson: Preserve DRRQR attribution with four structural arms so value-width pruning cannot silently replace the named Dk64 method.
    destination: candidate contract
    severity: high

