lessons_ingested:
  - lesson: Dv coordinate reduction changes the RMS denominator; complete-head reduction preserves it and is a materially different value/state compression mechanism.
    destination: candidate contract
    severity: high
  - lesson: Nv32 removes only one third of value-side work and cannot close the fixed gap under the existing optimistic ledger; screen only Nv16.
    destination: cost gate
    severity: high
  - lesson: Preserving the complete Dv128 coordinate width and RMS denominator is not sufficient when two of three independently parameterized value heads are deleted. Every one of 18 layer-fold comparisons failed the 1.10 projected-output gate, so head selection plus scalar output folding is closed rather than tuned.
    destination: drrqr-ascend-optimization-loop failure rules
    severity: high
