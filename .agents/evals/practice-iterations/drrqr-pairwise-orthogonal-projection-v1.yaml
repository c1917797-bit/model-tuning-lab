  - Implemented raw-Q/K projection followed by reduced-width normalization, projected-state recurrence replay and a static Ascend arithmetic screen.
  - Added focused tests for Gram validity, deterministic orthonormal pairing, exact one-hot energy semantics and operation-count claim boundaries.
  - Completed the predeclared three-fold cross-validation over indices 0-11 without loading the previously viewed indices 12-15.
