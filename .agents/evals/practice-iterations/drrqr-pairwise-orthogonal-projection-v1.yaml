lessons_ingested:
  - Coordinate replacement around energy-Dk64 was too locally constrained and produced heterogeneous head regressions.
  - A structured projection may retain information from all 128 coordinates while keeping a 64-wide recurrent state.
  - Runtime viability must be designed before numerical promotion; depthwise convolution prevents casually claiming free weight folding.
  - Previously viewed heldout data is not fresh evidence, even when the prior algorithm was invalid for a different reason.
  - Valid orthonormality and low estimated projection overhead did not preserve recurrent output geometry: every fold regressed post-RMS by more than 71 percent.
  - The next iteration should preserve dense prefill/initial-state construction and reduce only decode state, rather than replacing the feature basis throughout the sequence.
