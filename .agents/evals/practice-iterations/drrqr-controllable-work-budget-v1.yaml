  value_width_iteration: .agents/evals/practice-iterations/drrqr-two-sided-value-width-heldout-v1.yaml

profile_budget:
  protocol: four ranks, 30 pure-decode steps, concurrency 16
  drrqr_attributable_rank_mean_kernel_sum_ms:
    qkvz_projection: 83.100735000
    causal_conv: 27.899320000
    qkvz_split: 4.197305000
    qkv_slices: 11.808380000
    packed_concat: 21.657215000
    l2norm: 6.055360000
    gating: 10.978735000
    recurrent: 55.046810000
    rms_norm: 7.918120000
    output_projection: 39.859878750
    total: 268.521858750
  deliberately_optimistic_gdn_budget_per_step_ms: 8.950728625
  warning: Kernel sums are not additive critical-path time. Treating every component as additive and perfectly removable favors candidate admission.

scope_bounds:
  required_tpot_reduction_ms: 3.181664712
  required_fraction_of_optimistic_gdn_budget_percent: 35.546433
  uniform_layer_equivalent_at_48_gdn_layers: 17.062288
  key_state_only_perfect_credit_ms: 2.927359563
  key_state_only_shortfall_ms: 0.254305148
  key_state_definition: Perfect removal of the remaining Q/K share of QKVZ projection and convolution, two Q/K slice calls, all L2 normalization, and the entire recurrent kernel, without charging surviving work.
  key_plus_full_packed_perfect_credit_ms: 3.780470952
  key_plus_full_packed_note: This crosses only by treating all QKV slices and concat plus the full recurrent kernel as removable. The measured per-layer graph-floor iteration rejects that physical implementation family.
  value_output_note: Dv reduction is the only tested structural route with enough broad component coverage, but locked Dv64 and Dv48 failed every held-out downstream fidelity and robustness family.

reopen_contract:
  required_mechanism_scale: Remove or structurally avoid more than 35.546433 percent of the optimistic GDN budget, or provide a stronger measured endpoint argument, while retaining enough margin for launches and added work.
  required_algorithm_property: Remain recognizably DRRQR/state-rank work; generic model-layer skipping or an unrelated acceleration method does not satisfy the objective.
  required_fidelity: A locked fit/untouched downstream-output gate must change the existing value-width and Q/K-only evidence before NPU implementation.
  required_portability: Separate logical state representation from backend tiling and provide capability dispatch plus a correctness fallback; performance remains environment-qualified.

validation_commands:
  - Recompute all component sums from the frozen Dk64 profile and exact call-shape accounting.
  - Compare key/state-only and packed-fusion bounds with the fixed reciprocal-TPOT gap.
  - ./scripts/validate-mst.sh
  - git diff --check

outcome:
  class: bounded_negative_budget_map
  evidence_level: frozen endpoint plus target-runtime diagnostic profile and prior numerical/fidelity gates
  decision: No existing Dk-only, cache-only, or per-layer packed-fusion candidate meets the reopen contract. Do not spend NPU time until a materially different DRRQR mechanism crosses this scale and untouched-fidelity threshold.
  claim_ceiling: This is a target-stack admission bound, not a theorem about every future DRRQR formulation or another Ascend environment.
  code_changed: false
  npu_used: false
  endpoint_used: false
  accuracy_used: false

lessons_ingested:
  - Translate the remaining endpoint gap into a fraction of the entire algorithm-attributable sublayer budget, not just the next visible kernel.
  - A new selector is irrelevant when perfect key/state removal itself cannot close the gap.
  - Require a mechanism-scale threshold before reopening a closed research program.
