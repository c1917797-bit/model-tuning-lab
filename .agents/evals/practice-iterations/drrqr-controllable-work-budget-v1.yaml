id: drrqr-controllable-work-budget-v1
repository: model-tuning-lab
status: complete
date: 2026-09-13
validated_commit: b32cf4fdcb68d688387b3de4bae6b919d9f60402

stage_goal: Quantify the minimum full-path scale a materially different DRRQR mechanism must affect before any further algorithm, operator, NPU, or accuracy work is admitted.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Frozen dense is 135.142469917 output tok/s, energy-Dk64 is 141.564496153, the fixed target is 148.656716909, and reciprocal-TPOT admission requires another 3.181664712 ms/token.
  medium_term_milestone: Require a new DRRQR mechanism to affect enough source-bound GDN work to close the open gap after surviving launches and added work.
  short_term_decision: Partition the validated Dk64 profile into key/state-only, packed-fusion, value/output, and complete-GDN budgets and state an explicit reopen threshold.
  deciding_evidence: The frozen endpoint pair, exact four-rank 30-step Dk64 profile accounting, the measured fused-recurrent floor audit, and the held-out value-width rejection.
  budget_or_stop_rule: One offline profile-derived budget map. Do not implement or run a candidate whose perfect source-bound ceiling is below the gap or whose required surviving floor is below observed target-runtime evidence.
  on_pass: Admit only a named full-path DRRQR mechanism with an untouched downstream-fidelity gate and a portable operator plan.
  on_failure: Keep the bounded negative conclusion and do not replace it with generic optimization, layer skipping, MTP, quantization, or training.
  on_inconclusive: Bind at most one missing profile shape or call site if it can change the partition.

