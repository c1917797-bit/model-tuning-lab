lessons_ingested:
  - A relocation-aware source verifier is insufficient if the launch working directory can still shadow the installed package. Execute absolute audit/launcher paths from a neutral working directory and verify both source and installed identities.
  - Capture-time assertions and collector receipts are necessary but not sufficient. A separate immutable auditor should reload every tensor archive and independently check state continuity, tensor finiteness, source/library identity and protocol hashes.
