stage_goal: Decide whether a bimodal layerwise plan that keeps critical GDN layers at Dk128 and bypasses redundant GDN layers at Dk0 can cross the fixed performance target without abandoning the existing DRRQR fidelity contract.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Frozen dense is 135.142469917 output tok/s, the fixed target is 148.656716909, and the best energy-Dk64 endpoint screen is 141.564496153 tok/s. The complete optimistic Dk64 GDN budget showed that a new mechanism must affect more than 35.546433 percent of GDN work.
  medium_term_milestone: Admit only a full-path state-rank mechanism whose optimistic physical scale crosses the target and whose untouched local-output fidelity is no worse than the validated Dk64 reference.
  short_term_decision: Reuse the frozen dense profile and all-48-layer captured-teacher width curve to accept or reject the Dk0/Dk128 bimodal plan before implementation or NPU execution.
  deciding_evidence: The dense profile must show the integer number of fully bypassed GDN layers needed to cross the fixed target under a deliberately favorable additive model. A bypassed layer has zero GDN branch output, hence relative-L2 error exactly one against every nonzero dense teacher output; it must pass the frozen five-percent local-window regression gate versus energy-Dk64.
  budget_or_stop_rule: One offline source/profile/fidelity admission. Stop without code, build, NPU, endpoint or accuracy if the target requires broad branch removal or any proposed Dk0 layer fails the existing local-window gate.
  on_pass: Define a plugin-owned logical rank-zero representation, exact residual semantics, cache and graph identities, then run a target-NPU numerical/state gate before endpoint work.
  on_failure: Reject the Dk0/Dk128 bypass family for this objective and do not relabel generic GDN-layer pruning as DRRQR state reduction.
  on_inconclusive: Bind only a missing profile shape or teacher denominator if it can change the integer skip count or the exact zero-output error.

candidate:
  name: bimodal_layer_rank_0_128
  definition: Execute retained linear-attention GDN layers at original Dk128 and replace selected layers' complete GDN branch output with zero, leaving the residual path as a bypass.
  state_budget_equal_to_uniform_dk64:
    retained_dk128_layers: 24
    bypassed_dk0_layers: 24
    sum_dk: 3072
  scope_warning: Dk0 removes the complete GDN sublayer contribution rather than preserving a reduced recurrent state. Without a new rank-zero algorithmic derivation, this is generic branch or layer pruning, not paper-faithful DRRQR.

