validation_commands:
  - Rebind every dense GDN component by operator type, exact input shape and per-rank call count from the hash-bound baseline profile.
  - Recompute the additive dense GDN budget and integer skip threshold from the frozen endpoint denominator.
  - Evaluate the analytic Dk0 zero-output error against all 1152 energy-Dk64 teacher windows using the frozen denominator floor and 1.05 ratio limit.
  - ./scripts/validate-mst.sh
  - git diff --check

outcome:
  class: rejected_at_scope_and_fidelity_gate
  decision: Do not implement or run the Dk0/Dk128 bimodal plan. Equal-state-budget 24-layer bypass cannot reach the fixed target even under the favorable cost model; reaching it requires bypassing at least 32 of 48 GDN branches, while zero of 48 layers pass the untouched local-fidelity gate.
  claim_ceiling: This rejects complete GDN-branch bypass as a layerwise 0/128 plan for the current objective. It does not reject every future learned layer-pruning method or a genuinely derived rank-zero recurrent representation, but those would be new scoped algorithms and cannot inherit the DRRQR claim.
  code_changed: false
  npu_used: false
  endpoint_used: false
  accuracy_used: false

lessons_ingested:
  - A nominal Dk0 must be audited semantically; if it zeros the complete residual branch, it is layer pruning rather than a reduced recurrent representation.
  - For zero-output bypass, local relative-L2 is analytically one. Reuse frozen teacher windows to reject unsafe layer maps before implementation or NPU work.
  - Convert a whole-layer paper ceiling to an integer skip count. A candidate that must remove two thirds of algorithm-bearing layers and has no fidelity-safe layer is not an admissible performance route.
