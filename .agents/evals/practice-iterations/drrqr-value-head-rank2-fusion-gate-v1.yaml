lessons_ingested:
  - lesson: Nv32 cannot meet the fixed target as a structural reduction alone, but its residual 0.751051 ms/token is small enough to justify a combined fusion audit only after fidelity passes.
    destination: performance contract
    severity: high
  - lesson: A prior fusion rejected as insufficient alone may be reconsidered only for a named combined algorithm-operator candidate with overlap removed, never by adding independent optimistic ceilings.
    destination: drrqr-ascend-optimization-loop
    severity: high
  - lesson: Low raw operator-state reconstruction error is not a downstream fidelity result. Rank-2 retained most raw state energy at 0.061391 relative-L2, yet exact Z, RMS and output projection amplified the candidate to a 3.272293 projected-error ratio and all 18 layer-fold gates failed.
    destination: drrqr-ascend-optimization-loop
    severity: high
