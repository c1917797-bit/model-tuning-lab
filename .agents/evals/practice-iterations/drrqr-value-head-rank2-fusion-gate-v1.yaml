stage_goal: Decide whether an Nv32 rank-2 value-state representation preserves enough energy-Dk64 fidelity to justify reopening the corrected fused-recurrent route as one combined algorithm-operator candidate.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 is 141.564496153 output tok/s or +4.752041 percent. Nv32 structural savings alone have an optimistic ceiling of 146.919229779 tok/s or +8.714329 percent and remain about 0.751051 ms/token short of the fixed target.
  medium_term_milestone: Combine a fidelity-preserving DRRQR value-state reduction with a candidate-specific Ascend fusion whose overlap-aware net saving crosses the remaining endpoint gap.
  short_term_decision: Test the necessary representation capacity of two fit-locked orthogonal Dv128 latent states for every three-head key group, using the same deliberately favorable oracle boundary as the rejected rank-1 screen.
  deciding_evidence: Three predeclared folds on reused calibration indices 0-11, six representative layers, exact checkpoint output projection, the Nv32 component ledger, and the preserved corrected-fusion floor audit.
  budget_or_stop_rule: One rank-2 oracle run. No fusion arithmetic repair, build, NPU, service, endpoint or accuracy work unless the oracle passes and a later overlap-aware cost audit also crosses with margin.
  on_pass: Compute a component-by-component overlap-aware Nv32 plus corrected-fusion endpoint ceiling. Only a crossing result may admit repairing the known Stage2 squared-Q/K defect.
  on_failure: Reject Nv32 static rank-2 value-state compression and do not reopen fused recurrent for this combination.
  on_inconclusive: Repair only a concrete equation, identity or implementation defect and rerun once into a new immutable artifact.

candidate_contract:
  algorithm: Energy-Dk64 plus two orthogonal head-axis latent states per key head, reducing global Nv48 to Nv32.
  oracle_favors_candidate: Form the two states from all three real Dk64 operator outputs, retain all original Z gates and RMS applications, expand back to 48 heads, and use the exact output projection.
  operator_complement: Corrected raw-packed QKV normalization, gating and recurrent fusion is only reconsidered after fidelity and overlap-aware cost gates.
  fairness: Do not add the separate optimistic savings; remove every overlapping component once and retain measured floors and added arithmetic.
  paper_exact_strong_rrqr: false

