schema: mst-practice-iteration/v1
id: drrqr-dense-prefill-dk64-decode-v1
repository: model-tuning-lab
status: rejected
date: 2026-09-10
validated_commit: 475aea0

stage_goal: Determine whether exact dense prefill followed by one aligned energy-Dk64 state transition materially improves decode fidelity over all-phase energy-Dk64 while retaining a credible decode-speed path on Ascend.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 provides only 4.752041 percent endpoint gain and its 1024-token LongBench-v2 preflight is below historical dense accuracy. Changing coordinate scores or sparse subspaces did not provide enough recurrent fidelity.
  medium_term_milestone: Preserve dense prompt processing and first-token behavior while reducing the recurrent state and decode path to aligned Dk64 for the long 1024-token output phase.
  short_term_decision: On frozen dense trajectories, compare decode-only error after a dense-prefill state projection against the same energy-Dk64 selector run through both prefill and decode.
  deciding_evidence: Use calibration indices 0-11 with no fitted parameters. Dense-prefill candidate must have exact zero prefill output/state error by construction, transition once by gathering the frozen energy-Dk64 state columns, and then run the same Dk64 recurrence for eight decode steps. Require at least 20 percent lower aggregate decode post-RMS relative-L2, non-worse aggregate decode state relative-L2, at least 72 of 96 layer/rank/head groups non-worse, no group worse by more than 5 percent, finite outputs and exact Dk64/alignment/baseline-plan identity.
  budget_or_stop_rule: One CPU implementation and one frozen-trajectory run. No selector fitting, weight grid, NPU use, endpoint benchmark or task accuracy in this iteration.
  on_pass: Freeze the phase-transition contract, collect a new non-evaluation calibration set for admission, then implement a plugin-only native-NPU eager/state/NPUGraph prototype before endpoint screening.
  on_failure: Preserve and reject dense-prefill state transition as a fidelity recovery mechanism; do not weaken its gates. Reassess whether Dk64 needs an explicit low-cost tail-state correction.
  on_inconclusive: Fix only a demonstrated recurrence, state-transition, metric-window or identity defect and rerun once without changing the gates.

algorithm_contract:
  name: Dense-Prefill DRRQR-Decode Transition
  abbreviation: DPDT
  baseline: Frozen energy-Dk64 coordinate plan applied from the start of prefill through decode.
  prefill:
    width: 128
    outputs: Exact dense path.
    recurrent_state: Dense value-width by 128 state.
    causal_conv_cache: Dense 128-coordinate cache.
  transition:
    count_per_sequence: 1
    trigger: First true decode step after all prompt chunks complete, never a chunked-prefill boundary.
    recurrent_state: Gather the frozen energy-Dk64 columns from dense state.
    causal_conv_cache: Gather the same frozen energy-Dk64 coordinates.
    identity: Include plan hash, source width, target width and phase in cache and graph keys.
  decode:
    width: 64
    recurrence: Existing aligned energy-Dk64 recurrence.
    expansion: forbidden
  portability: Phase detection, state gathering and fallback use framework-visible shapes and the frozen plan, not 910B-specific addresses, timing constants or private runtime replacement.

ascend_implementation_contract:
  portable_fallback: Keep dense prefill weights; on decode compute compatible Q/K/conv outputs and gather the frozen coordinates before reduced L2Norm and the standard Dk64 recurrent operator.
  optimized_path: Store an explicitly named compact decode weight pack in the plugin and dispatch it only after the one-way phase transition.
  operator_scope: Only add or adapt an operator after trajectory and fresh-admission gates pass. Candidate work may fuse decode gather/normalization/recurrent operations but must remain opt-in.
  scheduler_scope: Chunked prefill, prefix-cache reuse, request migration and NPUGraph capture keys must distinguish dense-prefill and compressed-decode states.
  comparison: Apply every generic serving optimization equally to dense and DPDT.
  claims: Static or operator evidence cannot replace fixed-1024-token endpoint throughput, TTFT and TPOT.

