  - full project software test suite
  - one CPU replay over development indices 0-11
  - independent report audit
  - ./scripts/validate-mst.sh
  - git diff --check

lessons_ingested:
  - Energy-Dk64 coordinate identity is more stable than recurrence-weighted coordinate exchanges and sparse orthogonal replacement.
  - Accuracy risk may be dominated by applying compression while the prompt establishes recurrent state and hidden representations.
  - Fixed 1024-token output makes a one-time dense-prefill to compressed-decode transition potentially worthwhile, but endpoint evidence remains mandatory.
  - Chunked prefill boundaries are not decode transitions.
  - Exact dense prefill and a better compressed initial state are insufficient by themselves: DPDT improved aggregate decode state relative-L2 by 59.985923 percent yet worsened aggregate decode post-RMS by 2.183104 percent.
  - Optimize and gate the observable post-RMS decode output, not a state proxy alone.
  - The next bounded direction is an explicit low-cost decode-tail/output correction with a static foldability and Ascend cost contract; do not retry nearby phase-transition or selector variants.
