stage_goal: Fit and independently gate one named Dk64 Recurrent-Transition Saliency selector using the frozen, independently audited dense Ascend GDN trajectory corpus.

goal_chain:
  long_term_objective: Reproducible DRRQR deployment on Ascend with at least 10 percent end-to-end output-throughput gain, no LongBench-v2 or GSM8K accuracy decline, fixed TTFT/TPOT and resource contracts, and design-time portability.
  current_gap: Energy-Dk64 reaches only 4.752041 percent endpoint gain and has no accepted same-stack max_tokens 2048 quality result. StrongRRQR and three Q/K-only objectives were rejected. The new dense corpus now provides exact recurrent state, normalized Q/K, value, decay, beta, operator output and post-RMS output for a frozen train/held-out split.
  medium_term_milestone: A recurrence-aware Dk64 coordinate map that beats the frozen energy-Dk64 map on untouched trajectory evidence strongly enough to justify native-NPU multi-step replay.
  short_term_decision: Decide whether Recurrent-Transition Saliency can convert real dense state read, key-feedback and state-write influence into a Dk64 map with at least 10 percent lower untouched post-RMS error than energy-Dk64 while preserving state-transition fidelity.
  deciding_evidence: First independently reproduce the dense operator state/output equations from every frozen trajectory. Fit all score weights and coordinate choices on indices 0-11 only. Lock one global weight tuple and every per-head index set before loading indices 12-15. On untouched indices require at least 10 percent lower aggregate post-RMS relative-L2 than energy-Dk64, no worse aggregate selected-state relative-L2, at least 75 percent of 96 layer/rank/head groups non-worse, no group worse by more than 5 percent, exact Dk64/alignment/energy-floor contracts, and complete finite outputs.
  budget_or_stop_rule: One CPU-only implementation and bounded predefined global weight grid. Reuse the frozen 3456 archives; do not collect more data, touch an NPU, profile, integrate a plan, benchmark endpoints or run task accuracy in this iteration.
  on_pass: Freeze the selected plan and metrics, then create a separate native-NPU eager/state/NPUGraph replay iteration before any endpoint screen.
  on_failure: Preserve the selector and report as a negative recurrence-aware result; diagnose which read, feedback or write term failed, then choose one materially different recurrence-compensation design rather than retuning the same grid.
  on_inconclusive: Preserve partial evidence and fix only a demonstrated formula, identity or numerical-analysis defect before rerunning.

algorithm_contract:
  name: Recurrent-Transition Saliency
  abbreviation: RTS
  target_width: 64
  portability: Uses only model tensors and algebraic GDN recurrence quantities; no device-specific timing, kernel name, memory address or 910B-specific threshold enters the selection score.
  fit_terms:
    - normalized joint Q/K energy
    - dense state readout contribution
    - key-feedback contribution to the delta residual
    - direct state-write column contribution
  recurrence_equation: S_t = exp(g_t) * S_(t-1) + beta_t * (v_t - exp(g_t) * S_(t-1) @ k_t) outer k_t
  readout_equation: o_t = S_t @ q_t / sqrt(Dk)
  baseline: frozen energy-kernel Dk64 coordinate plan
  guardrails:
    max_swaps_per_head: 8
    q_energy_floor_relative_to_energy_baseline: 0.98
    k_energy_floor_relative_to_energy_baseline: 0.98
    one_global_weight_tuple: true
    head_specific_hyperparameters: false

