lessons_ingested:
  - A named baseline is an executable identity contract, not a label. Assert zero changed heads, zero swaps and unit retained-energy ratios before using it for model selection.
  - Aggregate recurrent-error improvement can hide unacceptable head-local regressions; retain per-head robustness gates before native-NPU admission.
  - Bounded coordinate exchanges around energy-Dk64 improved aggregate heldout error only 3.57 percent and harmed 43 of 96 heads, so do not tune another nearby Q/K coordinate-score grid.
  - The next DRRQR algorithm iteration must be materially different and preserve deployment relevance, for example a recurrence-aware structured subspace or compensation that has an explicit foldability and Ascend cost model before implementation.
  - CPU replay over audited NPU captures is only an admission screen. A passing design still requires native eager/state/NPUGraph numerical validation before endpoint performance and final accuracy.
