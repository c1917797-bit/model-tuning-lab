changes:
  - Added an exact CPU replay of the captured GDN recurrence and actual post-RMS gate for frozen dense trajectories.
  - Added a bounded, predeclared global weight grid for read, key-feedback and state-write saliency with at most eight coordinate exchanges per head.
  - Added fit-lock-before-heldout enforcement, exact frozen energy-plan identity, finite/width/alignment/energy-floor checks and per-head robustness gates.
  - Added focused software tests and eliminated repeated archive I/O by reusing decoded layer/rank trajectories.
  - Fixed three implementation defects before accepting evidence: removals originally targeted coordinate numbers instead of the lowest-scored selected coordinates; a no-candidate fit path could duplicate heldout evaluation; and the named energy baseline was incorrectly allowed to exchange coordinates.
  - Preserved recurrent-transition-selector-v1 as invalid because its fit comparator was not the frozen energy plan, then performed exactly one contract-permitted rerun after only the demonstrated baseline-identity fix.
validation_commands:
  - focused software tests for recurrence reconstruction, saliency terms, split isolation, width/alignment and fail-closed output
  - full project software test suite
  - one CPU selector run over the frozen capture
  - independent report/plan audit
  - ./scripts/validate-mst.sh
  - git diff --check

