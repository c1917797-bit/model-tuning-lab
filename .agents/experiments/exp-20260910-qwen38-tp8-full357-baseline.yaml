decision_reason: >-
  The performance controller completed all twelve cells with zero request
  errors, so the descriptive TP8 denominator is preserved. It is not promoted
  to a clean fully qualified baseline because c1-r2 has known coincident load,
  full-window isolation was not proven, and semantic quality did not complete.
next_loop: >-
