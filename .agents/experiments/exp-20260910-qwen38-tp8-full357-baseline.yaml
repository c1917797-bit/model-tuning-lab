    c1-r2 overlapped a 55,563,006,776-byte weight-identity read and an observed
    CPU operator build; its effect was not quantified and the original artifact
    remains preserved.
  - Other cells passed structural checks but were not proven interference-free
    for their complete measurement windows.
  - The failed quality follow-up does not prove a model-quality regression; it
    leaves semantic quality incomplete.
  - Do not compare this TP8 full357 denominator with TP4, quick32, T15, or the
    32K-input/1024-output long-context protocol.
