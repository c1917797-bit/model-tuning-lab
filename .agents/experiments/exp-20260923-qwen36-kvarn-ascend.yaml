    tile_npu_v3: "Physical NPU4 equation-derived smoke: batch 1/16 backend shared-state parity passed (max abs <= 1.05e-7); K/V pack roundtrips exact. Independent CPU/NPU packed values differed at 3/1 and 12/5 positions; synthetic K4/V2-vs-dense output cosine 0.898/0.875. Neither author-backend parity, model accuracy, nor service performance is established."
    author_parity_npu_v1: "Physical NPU4, batch 1/16: pinned author PyTorch Sinkhorn, K4/V2 store fields, and decode matched plugin equation probe exactly on NPU (all recorded max_abs=0). This is tile-format parity only, not cache lifecycle, NPUGraph, model accuracy, or E2E performance."
