decision_reason: "Author-reference tile parity, one-tile fused compute, rotated mixed-read graph replay, and slot-mapped staging writes passed narrow physical-NPU4 numerical gates. The compiler-compatible partitioned multi-block path had 204.207 ms median standalone latency at batch16/~16.5K tokens, while four monolithic variants failed before execution. No latency-plausible service candidate exists in this bounded loop. Reject this implementation, leave the paper inconclusive; no matched E2E throughput, TTFT/TPOT or final quality result was produced."
next_loop: "Move to another measured attention/matmul paper mechanism. Revisit KVarN only with a distinct fused/native operator and a true compressed-cache allocator/metadata path, then re-run numerical, service and matched dense gates. Do not infer a paper-wide no-go from this implementation failure."
