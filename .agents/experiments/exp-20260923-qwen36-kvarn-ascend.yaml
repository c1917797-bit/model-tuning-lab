    triton_dequant_split: "Physical NPU4 split typed-metadata K4/V2 dequant passed batch 1/16 bitwise exact vs author-matched restored tiles. First version's uint32-to-float lowering failed; signed-int32 byte conversion fixed it without changing 0..15/0..3 values. Operator-only result."
    fused_one_tile_attention: "Physical NPU4 K4/V2 dequant inside attention passed batch 1/16, six local Q heads, max abs 6.103515625e-5 vs full-precision-softmax reference. No sink/tail, paging, service, or performance claim."
    mixed_three_block_decode: "Four physical NPU4 versions failed before execution: Triton variable scope, two dynamic-branch cbuf-copy failures, and branchless BiShengHIR alignment planning. Scope is this monolithic compiler path, not KVarN mechanism."
    partitioned_mixed_decode: "Physical NPU4, batch 1/16, synthetic 128-token FP16 sink + 128-token K4/V2 middle + 1-42-token FP16 tail: max abs 3.0517578125e-5 vs full-support reference. Same captured NPUGraph replays were bitwise stable while query, compressed block ID and sink/tail pool slots changed. This is a mixed-read numerical/graph seam only; live cache allocation/writes, service, throughput and task accuracy are absent."
    partitioned_mixed_decode_full_frame: "Physical NPU4 v4 adds Q rotation and output inverse rotation; batch 1/16 graph results matched unrotated-frame full-support reference within max abs 3.0517578125e-5. This is still synthetic, not task accuracy."
    staging_pool_store: "Physical NPU4 v2 masked scatter matched independent pool reference bitwise for 1/16/129 tokens; 129 case actually crossed two physical blocks. Changed block lookup and K/V under captured graph remained exact and stable. No tile sealing, allocation manager or service evidence."
    partitioned_latency_diagnostic: "Standalone NPU4 diagnostic only, batch16: median 2.613/26.382/103.343/204.207 ms at 1/16/64/128 compressed blocks per request. Not same-protocol FIA or E2E. The split-per-block implementation is rejected for service investment because cost grows far beyond a plausible attention-layer budget."
