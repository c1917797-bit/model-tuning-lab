environment:
  host: chicaihong01
  model: /cache/efim/Qwen3.6-27B
  image: quay.io/ascend/vllm-ascend:v0.23.0
  image_id: sha256:660ce23a83574fdcd28ba126b07615829c06770c06fbdf6533f03cc4d90acdb1
  intended_host_devices: [4, 5, 6, 7]
  container_visible_devices: [0, 1, 2, 3]
  tensor_parallel: 4
  execution: eager
  batch: 1
implementation:
  boundary: hidden_states-plus-residual entering layers 0,4,...,60
  group: three sequential linear-attention decoder layers
  state_isolation:
    - one-slot zero causal-convolution cache per replay layer
    - one-slot zero recurrent cache per replay layer
    - live serving cache is read for reference only
  exact_control: full sequence replay from zero state
  candidates:
    - zero-state 5-percent tail replay
    - zero-state 10-percent tail replay
  measurements:
    - materialized group-boundary hidden state
    - per-layer final causal-convolution state
    - per-layer final recurrent state
correctness_guardrails:
  - fresh single-request prefill with no decode tokens
  - exact boundary hidden and residual are cloned before the live group
  - normal serving output and live cache are never replaced
  - exact full-group replay relative L2 no greater than 0.01
  - all exact and candidate metrics finite
  - live convolution and recurrent cache remain bitwise unchanged
  - source paths and hashes emitted at runtime
scope:
  includes:
    - real Ascend causal-convolution custom operator
    - real Ascend chunk recurrent path
    - input/output projections, normalization, gating and MLP
    - all 16 three-layer GDN groups when the NPU run succeeds
  excludes:
    - swapping reconstructed state into live decode
    - first-token logits
    - full-attention KV-cache integration
    - TTFT, throughput or task-quality claims
abort:
  - any NPU outside physical 4-7 is used
  - physical NPU4-7 are not all available immediately before launch
  - exact full-group control fails
  - live request output is mutated
offline_checkpoint:
  pinned_image_tests: 37/37 passed
  focused_tests: 16/16 passed
  early_plugin_registration: passed
  npu_run: not_started
next_gate: >-
  One 650-token TP4 NPU request. If all-rank exact controls pass, evaluate
  5%/10% group state and boundary errors before implementing first-token
  reconstructed-cache swapping.
