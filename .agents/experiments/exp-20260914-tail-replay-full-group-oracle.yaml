id: exp-20260914-tail-replay-full-group-oracle
stage: prepared
status: offline-gates-passed-npu-not-run
objective: >-
  Validate Tail-Replay at the real Qwen3.6 GDN-group boundary by replaying
  each three-layer GDN group from the exact cached boundary hidden/residual
  pair with isolated causal-convolution and recurrent state.
hypothesis: >-
  Replaying the last 5% or 10% of the exact full-attention boundary sequence
  from zero state reconstructs the three GDN layers closely enough to admit
  a first-token cache-swap canary.
primary_variable: MST_TAIL_REPLAY_RATIOS
algorithm_identity: tail-replay-full-gdn-group-oracle
source:
  branch: work/tail-replay-qwen36-ascend-piercing-20260914
