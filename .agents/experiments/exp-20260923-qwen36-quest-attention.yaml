decision_reason: >-
  The pre-registered useful-budget support gate failed: the six-head shared
  page set retained only 42.876% and 62.520% exact mass on its worst local
  head at 25% and 50% page budgets. First-call Python scoring overhead also
  needs a distinct low-cost solution. No Quest E2E or task-quality claim.
next_loop: >-
  Select a distinct measured attention/matmul mechanism with author code and
  a credible path through the existing Ascend kernel ABI; do not repeat this
  Quest shared-max variant without a new GQA-selection hypothesis.
rollback:
  command: disable Quest plugin opt-in and stop only owned candidate service
  verified: true
