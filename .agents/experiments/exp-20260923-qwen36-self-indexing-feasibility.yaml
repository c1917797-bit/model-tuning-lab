  The paper's GQA-pooled sign-magnitude token selector may retain useful
  attention on the actual Qwen3.6-27B TP4 Ascend decode path at a 5% token
  budget, unlike the tested Quest selected-page route.
objective: >-
  Establish a paper-equation-derived real-NPU investment gate for a future
  plugin-owned selected-token attention path. This is not an official-code
  port, deployed candidate, E2E benchmark, or task-accuracy result.
