decision_reason: >-
  The deployed Qwen3.6-27B TP4 real-model 20K decode probe passed the
  rotation and full-support mathematical checks, but 5%-token GQA-pooled
  sign selection retained only 55.1% mean and 14.5% minimum exact
  attention mass across tested heads. Per-head sign selection improved
  little; even exact-logit Top-K retained 73.0% mean and 32.1% minimum.
  This rejects custom token-sparse operator investment for the tested
  selector/budget/prompt, not the paper or final task quality. No E2E
  candidate was run.
rollback:
  command: disable QWEN36_SIA_PROBE_ENABLE and stop only the newly owned container
  verified: true
next_loop: >-
  Advance within the one-day paper budget to a distinct paper-backed
  attention or MatMul hotspot with a credible v0.23/CANN 9.1 expression
  path. Do not repeat this selector on the same prompt/budget. New candidate
  implementations still require native NPU numerical and graph gates before
  matched fixed-1024 E2E throughput and final tasks.
