protocol:
  primary_metric: per-head exact attention mass retained by paper-equation token selector
  correctness_guardrails:
    - Keep native dense output unchanged in a non-mutating plugin probe.
    - Observe all four TP ranks and full-attention layers 3, 31 and 63.
    - Validate randomized Hadamard transform dot-product identity on the live Q/K before interpreting selection.
    - Validate full-support FP32 mathematical attention against native BF16 FIA before interpreting sparse output errors.
    - Pool the six local query heads by coordinate-wise absmax sign for their one local KV head.
    - Score each token as max(sign_agreement - 128, 0) times rotated key L2 norm.
    - Include prefix64 and recent64 within max(ceil(0.05 times length),768) budget; additionally inspect 10% and 25% without claiming paper defaults.
    - Record selector phases separately from any native attention call; no timing is an E2E result.
  acceptance_thresholds:
    - A numerical investment gate only; custom token attention needs a separate ABI, graph, lifecycle and TP4 service validation.
    - Final objective remains at least 10% matched profiler-off fixed-1024 E2E output throughput gain.
    - Final LongBench-v2 and GSM8K loss must be at most 1 percentage point each under the latest user allowance, with both point and relative changes reported.
  abort_conditions:
    - Physical NPU4-7 overlap with an external real process or busy HBM/AICore at launch.
    - Rotated QK dot products materially disagree with unrotated on live tensors.
    - Full-support mathematical output materially disagrees with native dense.
    - Useful token budgets retain too little exact attention mass to justify a custom token-selective kernel.
    - Timebox deadline is reached.
  warmup: one 20718-token diagnostic prompt then four decode tokens
  repetitions: 1
  command: run one fail-closed controller into a new immutable result root
