protocol:
  primary_metric: "p50 TTFT and p50 TPOT at each frozen concurrency cell"
  correctness_guardrails:
    - "ShortGPT and Block Influence features are default off and preserve the unmodified path when unset."
    - "32/32 requests, zero errors, natural stop, and valid response schema in every measured cell."
    - "Same-runtime unpruned control plus privacy-safe semantic review shows no material query_rewrite business-quality regression."
    - "No quantization, model retraining, or unscoped NPU use."
  acceptance_thresholds:
    - "Against immutable original: TTFT speedup >= 2.0x at concurrency 1, 5, 8, and 16."
    - "Against immutable original: TPOT speedup >= 2.0x at concurrency 1, 5, 8, and 16."
    - "Against retained stack: TPOT improves in every concurrency cell before a layer set is promoted."
    - "Correctness guardrails all pass."
  regression_thresholds:
    - "Reject any layer set with material semantic-quality regression."
    - "Reject any final stack that misses either 2x target in any concurrency cell."
  abort_conditions:
    - "Docker reservation or npu-smi shows physical NPU4-7 are in use."
    - "Any command would access physical NPU0-3 or stop an unowned workload."
    - "Service startup, graph capture, or request completion fails."
    - "Block Influence samples are missing, non-finite, or ranking is not stable enough to freeze."
  warmup: "Use the existing frozen query_rewrite harness protocol; record exact warmup in run metadata."
  repetitions: 32
  command: "Wait for the only active fused-tail v10 queue exec-00000000000000f7 to become terminal, then run a fresh scripts/run_qwen35_shortgpt_bi_diagnostic.sh and freeze a passing layer set. If v10 is accepted, run CANDIDATE_MODE=shortgpt-fused-tail and use its completed unpruned candidate directory as SEMANTIC_CONTROL_DIR. If v10 is rejected or has no candidate matrix, first run CANDIDATE_MODE=shortgpt-retained-control without layer-set variables, then run CANDIDATE_MODE=shortgpt-retained against that completed control. Never use v9, timed-out exec-00000000000000e6, or the empty failed BI root as a semantic control."
