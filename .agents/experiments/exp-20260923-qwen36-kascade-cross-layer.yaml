schema: model-tuning-experiment/v1
id: exp-20260923-qwen36-kascade-cross-layer
status: attempted
decision: pending
hypothesis: >-
  Kascade's anchor-layer post-softmax pooled Top-K positions retain useful
  exact attention mass when reused at the next Qwen3.6 full-attention layer,
  despite intervening GDN layers and TP4's one KV head per worker.
objective: >-
  Test the official mechanism on live BF16 Ascend Qwen3.6-27B without changing
  serving output. This is an investment gate, not performance or task accuracy.
owner: paper-to-ascend
paper:
  url: https://arxiv.org/html/2512.16391v2
  official_repository: https://github.com/microsoft/kascade
  official_vllm_branch_commit: de249edf9f2b10f436e2bf6d9e70e29247a671c9
  license: MIT
