  start_utc: 2026-09-23T16:15:00Z
  deadline_utc: 2026-09-24T16:15:00Z
environment:
  source_commit: 5cb98caaadeff42b5b62b996e34bb2aaa29d20fd
  model_revision: /cache/efim/Qwen3.6-27B
  tokenizer_revision: /cache/efim/Qwen3.6-27B/tokenizer_config.json
  dtype_or_quantization: BF16 dense
  framework_versions:
    vllm_ascend: v0.23.0
    CANN: 9.1.0
  hardware_topology:
    physical_npus: [4, 5, 6, 7]
    tensor_parallel: 4
  runtime_topology: physical4-7 map to container0-3; reverify before load
protocol:
  primary_metric: exact attention mass retained by cross-layer KV-head Top-K reuse
  correctness_guardrails:
    - Native dense output is returned unchanged by the opt-in probe.
    - Sample all four TP ranks and full-attention pairs 3-to-7, 31-to-35, 59-to-63.
    - Verify full-support FP32 attention against native BF16 output before interpreting sparsity.
    - Anchor scores are summed post-softmax probabilities over the six local Q heads.
    - Compare 10%, 20%, 30% anchor-reuse with target-layer same-head and per-query-head exact Top-K oracles.
    - Preserve request and sequence identity across anchor and reuse observations.
    - Do not call attention-mass loss the final one-percentage-point task accuracy loss.
  acceptance_thresholds:
    - If cross-layer reuse is numerically promising, prove selected-token ABI and NPUGraph before service performance.
    - Final objective remains >=10% matched profiler-off fixed-1024 E2E throughput gain.
    - Final LongBench-v2 and GSM8K accuracy loss <=1 percentage point each under latest user allowance.
  abort_conditions:
    - Physical NPU4-7 overlap with a real external process or busy HBM/AICore.
    - Full-support mathematical oracle disagrees materially with native FIA.
    - Cross-layer selected support has insufficient mass or large selected-output error at useful budgets.
    - One-day deadline reached.
  warmup: one bounded 20718-token prompt and four dense decode tokens
  repetitions: 1
  command: one fail-closed non-mutating plugin diagnostic into a new immutable root
