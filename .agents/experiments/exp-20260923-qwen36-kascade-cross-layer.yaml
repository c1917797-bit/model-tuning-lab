decision_reason: >-
  On the tested Qwen3.6-27B BF16 TP4, one 20718-token repetitive prompt and
  10/20/30% budgets, even hindsight selection among all earlier same-rank
  anchor layers retained insufficient mass for some query heads and produced
  large intermediate output errors. Do not invest in an algorithm-specific
  token-sparse Ascend operator for this scoped local-anchor route now. This
  does not reject the whole paper, cross-rank head remapping, other prompts,
  or other budgets; no candidate E2E performance or task accuracy was measured.
next_loop: >-
  Close this Kascade investment gate and pivot to the next distinct paper
  aligned with the measured Ascend attention/matmul hotspots. Before any new
  operator, audit reusable vLLM-Ascend and ops-transformer primitives, then
  prove live numerical semantics and matched dense E2E benefit.
rollback:
  command: disable QWEN36_KASCADE_PROBE_ENABLE and stop only its owned container
  verified: true
