schema: ascend-inference-diagnostic/v1
id: exp-20261007-hypic-npu03-comm-root
status: inconclusive
owner_branch: work/hypic-npu03-comm-root-20261007
predecessor: hypic-qwen36-e2e-2048-20261006
objective: Explain the persistent approximately 339 ms/token Decode baseline gap on physical NPU0-3 without using NPU4-7.
observations:
  - The three-round no-cache TPOT weighted mean is 413.10 ms on NPU0-3 versus 74.51 ms in the historical NPU4-7 lane.
  - HYPIC saves 13.69 and 14.15 ms/token respectively; this is not a disappearance of the technique effect.
  - Diagnostic rank-0 Decode steps have median wall 387.89 ms and communication timeline union 356.10 ms.
  - About sixteen approximately 22 ms AIV AllReduce tasks recur per Decode step; three exported ranks start within approximately 14 us.
  - The model has sixteen full-attention layers. Layer attribution is a hypothesis, not yet source-proven.
  - HCCS static link health is OK with speed 224 and zero retries/errors; this is not a loaded-bandwidth test.
hypotheses:
  - H1: The same TP4 AIV AllReduce is intrinsically slow on physical NPU0-3, independent of the vLLM graph.
  - H2: The collective is fast standalone and the 22 ms service trace reflects graph, synchronization, or workload context.
  - H3: AIV expansion mode is the controlled factor; an otherwise identical default-mode run changes latency.
measured_20261007:
  trace:
    - In steady baseline Decode rank 0, approximately 16 small 40 KB AIV AllReduce tasks per step last approximately 22 ms while most other collectives last approximately 10 us.
    - Rank 0, 1, and 3 slow-call starts differ by approximately 7-14 us and have nearly equal approximately 22 ms durations.
    - Rank 2 raw profiling DB reveals the matching 40 KB collective starts approximately 22.67 ms later and itself lasts approximately 0.009 ms in a sampled step.
    - During that sampled delay rank 2 stream 45 repeatedly executes MEM_WAIT_VALUE while stream 46 waits; this is a graph or cross-stream synchronization symptom, not a proven hardware-link failure.
    - The earliest observed divergence precedes attention and collective entry: after reshape_and_cache, ranks 0/1/3 spend about 1-2 us in MEM_WAIT_VALUE, whereas rank 2 polls it about 7665 times over 22.4 ms; rank 2's subsequent FusedInferAttentionScore takes about 0.216 ms and its AllReduce about 0.009 ms.
    - The notification producer/condition for rank 2's wait is not identified; do not infer a faulty NPU2 or a source-level fix from temporal ordering alone.
    - Follow-up raw SQLite correlation identifies rank 2 stream 5 MEM_WRITE_VALUE at about 22.414 ms after the sampled rank-0 collective start, immediately before stream 45's MEM_WAIT_VALUE releases. CANN_API maps its connection to host-thread aclrtValueWrite starting at about 22.152 ms. This identifies the release action, but not why the host submitted it late.
  standalone_aiv:
    operation_id: exec-0000000000000892
    result: TP4 40 KB AllReduce median 0.260-0.262 ms across four ranks; 160 KB median 0.246-0.247 ms.
    cleanup: docker --rm completed and no owned NPU process remains.
  graph_replay_aiv:
    operation_id: exec-00000000000008b8
    result: Graph replay with sixteen 40 KB AllReduce calls median 0.216-0.218 ms for the whole replay across four ranks.
    cleanup: docker --rm completed and no owned NPU process remains.
  decision: H1 is not supported at tested sizes and H2 is favored. Neither standalone test reproduces the full-service stall. The first observed divergence is rank 2's pre-attention MEM_WAIT_VALUE; its notification producer and source-level trigger remain unproven.
  next_test: Run the frozen no-cache full service twice on physical NPU0-3 with --enforce-eager as the sole serving variable. Use the same 2 warmup requests and 4-request/128-output diagnostic stimulus, capture all four raw ranks, export ranks 0 and 2, compare steady Decode wait and request TPOT. This is a diagnostic comparison, not formal HYPIC performance evidence. Abort on occupied NPU0-3, occupied port 8223, source/image/device drift, missing correctness, or owned-service cleanup failure.
  graph_on_20261007:
    operation_id: exec-00000000000008f7
    result: 4/4 requests completed exactly 128 output tokens; profiled diagnostic TPOT weighted 499.00 ms/token.
    profile: All four ranks captured raw. Rank 0 exported completely; rank 2 raw capture was about 2.1 GB and timeline export exceeded the bounded parser window, so the full profile manifest is incomplete.
    cleanup: Exact graph-control container removed; physical NPU0-3 and port 8223 released.
    classification: Diagnostic request valid, complete four-rank CSV export inconclusive; do not call this formal service performance.
