  runtime_topology:
    host: chicaihong01
    plugin_delivery: "independent explicit opt-in monkeypatch; no upstream source edits"
    port: 8228
protocol:
  primary_metric: "end-to-end output tokens per second versus same-stack TP4 dense control"
  correctness_guardrails:
    - "physical NPU4-7 and all four TP workers proven from host-side process evidence"
    - "actual GDN output-projection implementation, collective kind, payload dtype and tensor geometry recorded from every worker"
    - "candidate preserves finite outputs and exact greedy token IDs on repeated identical prompts"
    - "candidate does not reduce communication precision below the baseline dtype"
  acceptance_thresholds:
    - "mean output throughput gain >= 10% over same-stack dense control"
    - "TTFT and TPOT reported separately"
    - "fixed 1024 output tokens, 40 requests, concurrency 16, three comparable repetitions per arm"
    - "LongBench-v2 and GSM8K paired accuracy do not decrease at max_tokens=2048"
  regression_thresholds:
    - "any final paired task-accuracy decrease"
    - "TPOT regression > 2% without an accepted end-to-end gain"
  abort_conditions:
    - "paper mechanism is already fully present and no distinct plugin candidate remains"
    - "actual collective payload is already BF16, making the paper's FP32-to-FP16 payload conversion a no-op or a precision regression"
    - "communication critical-path fraction is below 9.09% even under impossible total elimination, or below 18.18% for a credible 2x communication speedup"
    - "candidate cannot be delivered as an explicit opt-in plugin without upstream edits"
    - "real-NPU numerical or deterministic correctness failure"
    - "24-hour paper budget exhausted"
  warmup: "explicit service and workload warmups; profiling disabled for formal performance runs"
  repetitions: 3
  command: "first run a TP4 source/runtime communication inventory and bounded 30-decode-step profile; freeze the final 40x1024 command only if the applicability gate passes"
results:
  baseline: {}
  candidate: {}
  cold: {}
  steady: {}
  boundary: {}
  lifecycle:
    source_audit: "Qwen3.6 GDN already channel-shards q/k/v/z and recurrent/conv state by TP; packed parameter loading is TP-aware; output projection is row-parallel and vLLM-Ascend exposes both ordinary AllReduce and fused MM-AllReduce paths."
    runtime_inventory: "A four-rank TP4 probe selected MatmulAllreduceRowParallelOp for every one of 48 GDN output projections on every rank: 192 selection events total. Forty-four sampled runtime calls covered warmup, request prefill and decode on all four workers. Every input, weight and output tensor was BF16; observed input shapes were (10240,1536), (30,1536) and (1,1536), with BF16 output shapes (10240,5120), (30,5120) and (1,5120)."
    request_canary: "One 30-token prompt with 16 generated tokens completed on the instrumented TP4 service. This request was used only to exercise prefill/decode hooks and is not performance or accuracy evidence."
    performance: "Not run: the applicability abort condition fired before a distinct candidate existed. Benchmarking the same fused BF16 path under two labels would not be a valid baseline/candidate comparison."
    accuracy: "Not run: no candidate changed model execution or numerics."
  resources:
    live_orientation: "2026-09-20: NPU4-7 idle at approximately 2867-2869 MiB HBM with no NPU processes; unrelated Qwen3.5 container maps only physical NPU0-3."
    execution: "Four vLLM worker host PIDs were proven on physical NPU4,5,6,7. Probe container qwen36_ssm_tp_inventory_mmar_v1_20260920 exited 0 and was preserved; NPU4-7 returned to idle baseline."
artifacts:
  - path: /cache/cch/ssm-tp-qwen36-npu4-7-20260920/inventory-mmar-v1/evidence.jsonl
    sha256: 7e45b0f74b11bf7044e3d9bb2e381dc5a1eeeb07c917ec10e3e23e8ac2344f91
    scope: "read-only runtime selection/dtype/shape evidence; not a benchmark"
decision_reason: "Rejected at the predeclared applicability gate. Qwen3.6/vLLM-Ascend v0.23 already provides the paper's channel-wise model/state/cache sharding and TP-aware packed loading. The live production GDN boundary selected fused MatmulAllreduceRowParallelOp on all 192 layer/rank selections, and all sampled prefill/decode payloads were already BF16. The paper's optional FP32-to-FP16 communication conversion is therefore a no-op; lowering below BF16 would violate the lossless/no-accuracy-loss boundary. No distinct plugin candidate remained, so profiling, E2E performance and task accuracy were intentionally not run."
next_loop: "Advance the fixed queue to EPD-Serve and apply the same architecture, deployment-boundary and distinct-candidate applicability gate before consuming NPU time."
rollback:
  command: "disable the explicit plugin switch and stop only this workstream's container/processes on physical NPU4-7"
  verified: true
