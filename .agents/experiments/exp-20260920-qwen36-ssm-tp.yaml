schema: model-tuning-experiment/v1
id: exp-20260920-qwen36-ssm-tp
status: completed
decision: rejected
hypothesis: "After accounting for Qwen3.6 TP sharding already present in vLLM-Ascend v0.23, a lossless plugin-selected communication optimization on the real GDN output-projection path can reduce TP4 decode critical-path communication enough to improve end-to-end output throughput by at least 10%."
objective: "Pierce arXiv:2602.21144 on Qwen3.6-27B and Ascend 910B4 within 24 hours, separating already-upstream TP mechanisms from a genuinely novel, correctness-preserving plugin candidate."
