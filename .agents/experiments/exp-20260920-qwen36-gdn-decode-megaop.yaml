decision_reason: "The exact v13 hybrid passed the complete real-NPU numerical/state/graph gate and dispatched on all TP4 workers, but the one-shot fixed-1024 E2E screen delivered 118.455179 tok/s versus the frozen same-stack dense 125.819134 tok/s (-5.852810%), with TTFT and TPOT both worse. The failed performance gate makes final accuracy spend unjustified."
next_loop: "Switch to DeltaLog. First prove a distinct deferred recurrent-state materialization seam and an end-to-end Amdahl opportunity in the real v0.23 Qwen3.6 path; abort before implementation if the runtime already forces per-step materialization."
