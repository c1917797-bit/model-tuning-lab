  correctness_guardrails:
    - "actual loaded plugin and operator identity is captured from every rank"
    - "real NPU multi-step eager output and full mutated state match the unmodified Ascend reference within predeclared per-dtype limits"
    - "real NPU graph replay is deterministic and preserves state-index semantics"
    - "no NaN or Inf in output or complete state"
    - "final LongBench-v2 and GSM8K use thinking disabled, max_tokens=2048, normal EOS, and do not decrease"
  acceptance_thresholds:
    - "affected local decode route speedup >=2.79680x before service A/B"
