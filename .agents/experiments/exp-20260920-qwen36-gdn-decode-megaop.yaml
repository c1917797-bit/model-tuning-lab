protocol:
  primary_metric: "profiler-off end-to-end output throughput for fixed 1024 output tokens"
  correctness_guardrails:
    - "actual loaded plugin and operator identity is captured from every rank"
    - "real NPU multi-step eager output and full mutated state match the unmodified Ascend reference within predeclared per-dtype limits"
    - "real NPU graph replay is deterministic and preserves state-index semantics"
    - "no NaN or Inf in output or complete state"
    - "final LongBench-v2 and GSM8K use thinking disabled, max_tokens=2048, normal EOS, and do not decrease"
  acceptance_thresholds:
    - "affected local decode route speedup >=2.79680x before service A/B"
    - "end-to-end output throughput gain >=10% versus same-stack dense with identical generic optimizations"
    - "TTFT and TPOT are reported separately"
    - "LongBench-v2 accuracy delta >=0"
    - "GSM8K accuracy delta >=0"
  regression_thresholds:
    - "any task accuracy decrease"
    - "candidate throughput gain <10% at final paired acceptance"
  abort_conditions:
    - "ABI or state mutation cannot be represented safely through the plugin boundary"
    - "real NPU numerical or graph-replay gate fails"
    - "credible affected scope is smaller than the shape-filtered measured seam"
    - "credible implementation cannot plausibly reach 2.79680x on the affected route"
    - "result exists only in CPU, simulator, or isolated operator evidence"
  warmup: "compile/graph warmup outside measured windows; exact count frozen before service A/B"
  repetitions: 3
  command: "first: bounded NPU numerical probe; then, only if it passes, paired profiler-off service A/B with fixed output 1024"
