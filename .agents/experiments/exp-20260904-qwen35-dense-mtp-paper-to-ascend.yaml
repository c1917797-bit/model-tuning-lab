  cann: 9.1.0
  driver: 25.2.0
workload:
  backend: vllm_bench_serve_openai
  prompt_tokens: 256
  output_tokens: 256
  requests: 64
  concurrency: [8]
  ignore_eos: true
  seed: 20260904
  repetitions: 3
  warmup_requests: 8
metrics:
  primary: output_tokens_per_second
  secondary: [request_throughput, ttft_p50, ttft_p95, tpot_p50, tpot_p95, acceptance_rate, hbm_peak]
thresholds:
  accept: "median output_tokens_per_second improves >= 5% at concurrency 8 and correctness passes"
  regress: "median output throughput regresses > 3% or TPOT p95 regresses > 5%"
  abort: "NPU4-7 state changes, competing NPU0-3 process appears, MemAvailable < 8 GiB, HBM > 31.5 GiB/device, server errors, or correctness mismatch"
correctness:
  greedy_exact_match_prompts: 8
  requirements: "baseline and MTP text and completion token counts match exactly at temperature 0; zero request errors; physical NPU0-3 execution proven"
artifacts:
