schema: ascend-inference-experiment/v1
id: exp-20260904-qwen35-dense-mtp-paper-to-ascend
status: baselined
decision: pending
objective: Improve decode throughput and TPOT for the installed dense Qwen3.5-27B without retraining.
hypothesis: The checkpoint's built-in MTP head can propose tokens cheaply enough that exact speculative verification reduces serial target-model decode steps on Ascend 910B4.
paper:
  primary: "Fast Inference from Transformers via Speculative Decoding"
  arxiv: "2211.17192"
  model_specific_mechanism: "Qwen3.5 built-in multi-token prediction head"
selection_evidence:
  model: "config declares mtp_num_hidden_layers=1; weight index contains 15 mtp tensors"
  source: "vLLM 0.23.0 and vLLM-Ascend source include qwen3_5_mtp config, model, and Ascend forward patches"
  profile: "historical decode captures are dominated by repeated MatMul and TP communication; exact MTP targets the number of serial target forwards"
primary_variable: "speculative_config off -> {method:qwen3_5_mtp,num_speculative_tokens:3,enforce_eager:true}"
environment:
  host: chicaihong01
  hardware: "4 x Ascend 910B4, physical NPU0-3; NPU4-7 excluded"
  cpu_affinity: "96-191"
  endpoint: "127.0.0.1:8220"
  model_path: /cache/austinov/Qwen3.8-27B
  model_config_sha256: 191e0af232104ed8b65258cf3fb2b842e288008baca7633c11b82a1ac7203aab
  tokenizer_config_sha256: b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27
  weight_index_sha256: 77042094076611b69791a610065f28b7013b8c621795fa86ddccc8bac7d1b9df
  dtype: bfloat16
  tensor_parallel_size: 4
  image: "quay.io/ascend/vllm-ascend@sha256:471744200c5d0c768c1f6c6a6816dcae0fd551de2487d4d129b6fb750024ce6a"
  vllm_commit: 0fc695fc6d1d82e9a5ac6835ac8e4e1c83703665
