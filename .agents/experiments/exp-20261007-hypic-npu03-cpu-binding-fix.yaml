  comparability: All three candidate contracts have byte-identical serving commands, image digest, source commit, benchmark SHA256, cpuset, and physical NPU0-3 mapping; only the artifact root/container lifecycle differs from the frozen baseline besides the declared binding-off switch.
  validity: Each candidate run completed 40/40 exact 1024-token outputs, zero failures, fresh service lifecycle, no profiler, and exact container rollback.
  baseline_median: Weighted TPOT 410.8960 ms/token, per-run TPOT P95 median 447.0755 ms, TTFT P95 median 81137.27 ms, output throughput median 29.7427 token/s, duration median 1377.1458 s.
  candidate_median: Weighted TPOT 77.5641 ms/token, per-run TPOT P95 median 117.8840 ms, TTFT P95 median 80775.49 ms, output throughput median 117.2930 token/s, duration median 349.2109 s.
  effect: Median weighted TPOT 81.12 percent lower, median TPOT P95 73.63 percent lower, median throughput 3.94x, median duration 74.64 percent lower; no TTFT P95 regression.
