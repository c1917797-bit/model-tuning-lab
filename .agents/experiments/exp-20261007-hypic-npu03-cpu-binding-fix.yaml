progression:
  canary: One non-profiled no-cache service lifecycle; run the existing 32768-token semantic canary and a four-concurrent 128-output smoke before formal traffic.
  fail_fast: One 40-request x 1024-output c16 run after two warmups; require 40/40 exact-length, zero errors, weighted TPOT at least 20 percent below frozen baseline mean, no TTFT P95 regression above 10 percent, and no neighboring-resource disturbance.
  full_performance: If fail-fast passes, three candidate repetitions of the exact frozen 32768-input/16384-prefix/1024-output/40-request/c16 protocol, without profiler; report each run and dispersion.
  full_quality: The prior 2048-token paired ruler was incomplete. A complete matched baseline and candidate LongBench-v2/GSM8K suite is still required before production or HYPIC adoption claims; do not relabel a semantic canary as that gate.
  abort: Any foreign NPU0-3 process, port contention, source/image/model drift, invalid output, failed rollback, or NPU4-7 access.
rollback: Stop and remove only the uniquely named candidate container after identity verification; prove NPU0-3 and port 8223 released. Removing the opt-in launcher flag restores the official binding path.
decision_rule: Accept only with comparable repeated performance, required quality, activation, and rollback; otherwise classify partial-component, rejected, failed, or inconclusive without modifying shared service.
