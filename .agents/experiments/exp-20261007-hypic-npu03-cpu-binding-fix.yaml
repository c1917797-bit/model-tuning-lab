symptom:
  frozen_formal_baseline: Three NPU0-3 no-cache 40-request x 1024-output runs gave weighted TPOT 417.5428, 410.8568, and 410.8960 ms/token; all 40/40 fixed-output valid.
  profiler_diagnostic: Binding-off-only short profiled run improved weighted TPOT 499.0045 to 140.9520 ms/token with 4/4 x 128 outputs and rank-0/2 graph task-update waits collapsing.
  cause_confidence: Strong path-level causal attribution to enabled automatic CPU binding; overlap versus other binding sub-operations remains unisolated.
candidate:
  class: supported_upstream_configuration
  primary_variable: Add only --additional-config '{"enable_cpu_binding":false}' to the frozen serving command.
  attribution: This is an upstream vLLM-Ascend switch, not a novel local monkeypatch.
  activation: Exact container command and parsed service additional_config must show false; worker.py live source hash/conditional must match pinned image; disabled control retains original command.
  delivery: Explicit opt-in isolated launcher; no shared image, canonical checkout, existing container, driver, firmware, IRQ, or NPU4-7 change.
  opportunity_bound: The profiled short diagnostic suggests up to approximately 358 ms/token of removable common floor at that concurrency; the unprofiled formal 40x1024 gain is unknown until measured.
