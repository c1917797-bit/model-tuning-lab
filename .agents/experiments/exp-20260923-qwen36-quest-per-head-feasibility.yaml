schema: model-tuning-experiment/v1
id: exp-20260923-qwen36-quest-per-head-feasibility
status: decided
decision: no_go_for_current_25_50pct_per_head_operator_path
hypothesis: >-
  Paper-faithful per-Q-head Quest page selection may retain materially more
  useful attention than the rejected six-head shared-max Ascend FIA derivative.
  A real-model mathematical oracle can decide whether a dedicated per-head
  Ascend sparse-attention operator is worth implementing.
objective: >-
  Bound the remaining Quest migration gap, without claiming E2E performance
  or task accuracy from intermediate attention tensors.
owner: paper-to-ascend
