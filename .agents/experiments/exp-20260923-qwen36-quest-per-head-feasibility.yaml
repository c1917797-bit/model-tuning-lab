  runtime_topology: physical4-7 map to container0-3; verify before launch
protocol:
  primary_metric: exact per-head selected attention mass and output error versus dense
  correctness_guardrails:
    - All four TP ranks emit one sample for attention layers 3, 31 and 63.
    - Verify the full-support mathematical oracle against native dense FIA before interpreting the sparse oracle.
    - Compare paper per-head Top-K with the already-rejected shared-max Top-K using the same Q/K/V and 25%/50% page budgets.
    - Preserve the native dense output; this diagnostic is non-mutating.
    - Report one-time summary build, first-call score, selection and FIA timings separately; do not infer steady-state or E2E gain.
  acceptance_thresholds:
    - If the per-head selector appears numerically useful, require a distinct plugin-owned per-head operator path and NPU correctness before any throughput claim.
    - Final acceptance remains >=10% matched profiler-off fixed-1024 E2E throughput and at most 1 percentage-point loss on each final task.
  regression_thresholds: []
  abort_conditions:
    - Physical NPU4-7 foreign-process overlap at launch.
    - Full-support math oracle materially disagrees with dense native FIA.
    - Per-head selected support is still too inaccurate to warrant custom kernel development at useful budgets.
    - Original Quest slot deadline 2026-09-24T00:20:00Z is reached.
  warmup: one 20718-token prompt then four decode tokens, same as the prior real-model probe
  repetitions: 1
  command: record exact one-shot controller and immutable result root
