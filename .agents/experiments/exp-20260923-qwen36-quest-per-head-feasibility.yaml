decision_reason: >-
  On one repetitive 20K-token prompt at three attention layers, faithfully
  selecting pages per local Q head improves retained mass over shared-max
  selection but still loses substantial exact attention mass at the only
  25%/50% budgets with plausible traffic reduction. This is a scoped
  implementation-investment no-go, not a paper-wide or final-task-quality
  verdict. No service candidate or E2E benchmark was run.
next_loop: >-
  Advance to a distinct paper-backed measured hotspot. A Quest reopening
  requires a new selector/support mechanism and an E2E opportunity argument,
  not a repeat of these budgets or this prompt.
rollback:
  command: disable QWEN36_QUEST_PROBE_ENABLE and stop only the newly owned service
  verified: true
