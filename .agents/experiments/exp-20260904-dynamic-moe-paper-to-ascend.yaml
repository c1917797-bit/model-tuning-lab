schema: model-tuning-experiment/v1
id: exp-20260904-dynamic-moe-paper-to-ascend
status: verified
decision: pending
hypothesis: "Replacing fixed Top-2 MoE routing with cumulative-probability dynamic routing can reduce average activated experts while preserving quality, and on Ascend can convert that compute reduction into end-to-end decode/throughput benefit if routing and variable-expert dispatch overhead are controlled."
objective: "Create and validate a reusable Paper-to-Ascend pipeline, using Dynamic MoE as the first NPU-native exemplar and producing an integration-ready contract for vLLM-Ascend/CANN."
owner: "chatgpt"
git:
  branch: work/exp-20260904-dynamic-moe-paper-to-ascend
  base_commit: "fbc79c41c37c8900f0623ce8941304e9bfde5cf1"
  stage_commits:
    - "planned: ea0c6e69a5a613ed45939be533e110686d78b154"
    - "attempted: a37d7282a976e90af3e3b943a522cf6eed60f705"
paper:
  title: "Harder Tasks Need More Experts: Dynamic Routing in MoE Models"
  venue: "ACL 2024"
  arxiv: "2403.07652"
  code_url: "https://github.com/ZhenweiAn/Dynamic_MoE"
  code_commit: "f56bc20db176f22ab51cb56b7dcb96403fb2cd8a"
  local_reference_path: "/home/mtuser/cch/paper-sources/Dynamic_MoE"
  migration_unit: "MoE router + expert dispatch policy"
  algorithm_contract: "softmax router probabilities -> descending sort -> minimal prefix whose cumulative mass reaches top_p_threshold -> weighted expert aggregation"
environment:
  source_commit: ""
  model_revision: "paper upstream model weights not yet pinned locally"
  tokenizer_revision: "paper upstream model weights not yet pinned locally"
  dtype_or_quantization: "BF16 target; routing smoke uses FP32 probabilities unless overridden"
  framework_versions:
    target_stack: "CANN 9.1 / torch-npu / vllm-ascend 0.23.0"
  cann_driver_firmware:
    driver: "25.2.0"
    firmware: "7.7.0.3.220"
  hardware_topology:
    host: "chicaihong01"
    npu: "8 x Ascend 910B4, 32 GiB HBM each"
  runtime_topology:
    reserved_for_this_workstream: [0, 1, 2, 3]
    excluded_active_workstream_devices: [4, 5, 6, 7]
protocol:
  primary_metric: "end-to-end TPOT or throughput at matched quality; router microbenchmark is a diagnostic metric only"
  diagnostic_block_ab:
    scope: "single-card Ascend-native MoE block: routing + compact token/expert dispatch + BF16 grouped matmul/SwiGLU/grouped matmul + weighted combine"
    purpose: "measure whether reduced expert activations can offset Dynamic MoE routing/dispatch overhead before full-model integration"
    device: "physical NPU0 in the same CANN/torch-npu container for both baseline and candidate"
    experts: 8
    hidden_size: 2048
    expert_intermediate_size: 768
    token_counts: [128, 512, 2048, 4096]
    dtype: "bfloat16"
    baseline: "fixed Top-2 with the same router probabilities, hidden states, expert weights, warmup, and repetitions"
    candidate: "cumulative-mass Dynamic MoE with top_p=0.4 and physically compacted selected token/expert pairs"
    repetitions: 5
    warmup_iterations: 20
    measured_iterations: 100
    diagnostic_success_threshold: "median whole-block latency improves >= 5% at one or more representative token counts without a p95 regression at that same point"
    interpretation_limit: "diagnostic only; cannot satisfy paper acceptance because no real MoE model quality checkpoint is locally available"
  correctness_guardrails:
    - "selected experts are exactly the minimal descending-probability prefix reaching the configured cumulative threshold"
    - "selected routing weights and expert ids match the reference contract on deterministic cases"
    - "no NaN/Inf and all tokens activate at least one expert"
    - "full-model candidate quality is no worse than baseline by more than 0.5 absolute percentage points on the frozen evaluation slice"
  acceptance_thresholds:
    - "average activated experts < 2.0 on the frozen representative workload"
    - "at matched quality, steady-state throughput improves >= 5% OR TPOT improves >= 5% versus fixed Top-2"
  regression_thresholds:
    - "quality regression > 0.5 absolute percentage points"
    - "steady-state p95 latency regression > 5% without compensating primary-metric benefit"
  abort_conditions:
    - "NPU0-3 are no longer exclusively free for this workstream"
    - "NPU health is not OK or unexpected HBM/process occupancy appears"
    - "OOM, NaN/Inf, or routing correctness mismatch"
  warmup: "router microbench: >=20 iterations; full model: explicit compile/load warmup outside measurement"
  repetitions: 3
  command: "python scripts/paper_to_ascend/dynamic_moe_npu_smoke.py --device npu:0 --experts 8 --tokens 4096 --top-p 0.4"
results:
  baseline:
    router: "fixed Top-2 diagnostic baseline"
    median_us: 175.645
    p95_us: 186.28
  candidate:
    router: "dynamic cumulative-mass routing, top_p=0.4"
    correctness: pass
    mean_activated_experts: 1.75244140625
    activation_histogram:
      1: 1228
      2: 2654
      3: 214
    median_us: 362.805
    p95_us: 376.05
  cold:
    first_attempt: "failed before algorithm execution: aclInit error 507008 / SoC version unavailable because driver/DCMI bind mounts were incomplete"
    recovery: "matched the known-good vLLM container driver/DCMI mounts; rerun succeeded"
  steady:
    scope: "router-only microbenchmark; diagnostic, not an end-to-end paper performance decision"
    tokens: 4096
    experts: 8
    top_p: 0.4
    device: "physical NPU0 mapped as container npu:0"
  boundary: {}
  lifecycle: {}
  resources: {}
  block_ab: {}
artifacts:
  - type: "command"
    value: "scripts/paper_to_ascend/run_dynamic_moe_npu_smoke.sh 0"
  - type: "validation"
    value: "5 routing unit tests passed in the vllm-ascend v0.23.0 container; Maintainer Skill Tree validation passed; git diff --check passed"
  - type: "live-evidence"
    value: "NPU0-3 had no NPU processes before run; NPU4-7 retained the prefix-cache VLLMWorker_TP processes"
decision_reason: ""
next_loop: "Build a bounded max_k dynamic-router prototype compatible with vLLM-Ascend fused MoE dispatch, then profile router+permute+GMM+unpermute on NPU0-3 before attempting a full MoE model quality/performance comparison."
rollback:
  command: "No production runtime is modified in the planned/reference stage; stop/delete only the isolated test container if used."
  verified: false
