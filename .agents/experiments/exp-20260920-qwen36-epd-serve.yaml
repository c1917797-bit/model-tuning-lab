protocol:
  primary_metric: "end-to-end output tokens per second versus the same-stack four-card monolithic control"
  correctness_guardrails:
    - "same checkpoint, tokenizer, generation settings and total physical NPU4-7 allocation"
    - "prove whether the frozen performance workload contains media and activates Encode"
    - "prove E, P and D instance ownership and transfer events rather than inferring activation from launch configuration"
    - "exact greedy token identity before formal performance"
  acceptance_thresholds:
    - "mean output throughput gain >= 10% over same-stack four-card control"
    - "TTFT and TPOT reported separately"
    - "fixed 1024 output tokens, 40 requests, concurrency 16, three comparable repetitions per arm"
    - "LongBench-v2 and GSM8K paired accuracy do not decrease at max_tokens=2048"
  abort_conditions:
    - "the frozen performance and accuracy workloads are text-only, so no Encode-stage work exists and the distinct EPD mechanism cannot activate"
    - "the only remaining candidate is ordinary PD disaggregation already supported upstream rather than a paper-derived EPD contribution"
    - "the required E/P/D deployment cannot fit within the same four physical cards without CPU offload, quantization or resource oversubscription"
    - "the result would require modifying vLLM, vLLM-Ascend, CANN, the image or model rather than an opt-in plugin"
    - "real-NPU numerical or deterministic correctness failure"
    - "24-hour paper budget exhausted"
  repetitions: 3
  command: "first audit workload modality, v0.23 EPD seams, model-instance memory geometry and same-resource comparability; launch NPU services only if all gates pass"
