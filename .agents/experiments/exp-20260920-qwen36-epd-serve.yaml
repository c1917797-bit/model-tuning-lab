  stage_commits: []
environment:
  source_commit: "vllm-ascend v0.23.0@5cb98caaadeff42b5b62b996e34bb2aaa29d20fd; paper arXiv:2601.11590v1"
  model_revision: "/cache/efim/Qwen3.6-27B; config sha256 69db4eb7196bc8190813231b3018ca05d8c2e3abc7b1af19d55c157af44a9d9c"
  dtype_or_quantization: "BF16 weights/activations; no quantization"
  hardware_topology:
