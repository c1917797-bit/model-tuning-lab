hypothesis: "On the fixed four-card Qwen3.6 workload, an explicit opt-in EPD deployment can isolate encode/prefill/decode interference and improve end-to-end output throughput by at least 10% without changing model outputs."
objective: "Pierce arXiv:2601.11590 on Qwen3.6-27B and Ascend within 24 hours, proving workload, resource and plugin-delivery fit before launching a multi-instance service."
owner: codex
git:
  branch: work/epd-serve-qwen36-ascend-20260920
