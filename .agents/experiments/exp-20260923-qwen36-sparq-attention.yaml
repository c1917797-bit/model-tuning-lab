  runtime_topology: verify process/container/device mapping before load
protocol:
  primary_metric: profiler-off end-to-end output tokens per second
  correctness_guardrails:
    - Match the author SparQ reference top-r/top-k selection on identical small tensors before adapting to page selection.
    - On physical NPU4, verify selected page indices and table invariants, eager and NPUGraph replay, batch 1 and 16, with changing slots and lengths.
    - Assert one local KV head per TP4 worker; if a different TP/version has multiple local KV heads, use explicit capability fallback or a per-head sparse interface, not an unmeasured union assumption.
    - Reject non-finite outputs, invalid page indices, state corruption, or nondeterministic identical replays.
    - Compare sparse attention output with a reference over precisely the selected KV support; freeze numerical tolerance against the native BF16 reference before evaluating the candidate.
    - Prove all four TP workers dispatch the opt-in candidate before an end-to-end claim.
  acceptance_thresholds:
    - Three comparable profiler-off runs each arm, fixed 1024 output tokens, mean candidate throughput at least 1.10x same-stack dense.
    - Report TTFT and TPOT independently.
    - Final LongBench-v2 and GSM8K each meet the user-allowed E2E 1% loss rule; report percentage-point and relative-percent loss separately.
  regression_thresholds:
    - A single correctness-passing E2E screen below dense throughput is implementation-scoped no-go unless trace identifies a distinct removable overhead.
  abort_conditions:
    - No proven Qwen GQA-compatible paged-KV selection and graph-safe integration seam.
    - Selector cost plus sparse attention cannot plausibly beat the 10% E2E threshold.
    - NPU numerical, state, replay, or TP4 dispatch failure.
    - Stop this paper after 24 hours from formal start; preserve evidence and move to the next paper.
  warmup: freeze with the existing 32768-input/16384-prefix/1024-output service protocol
  repetitions: 3
  command: record exact dense and candidate launch/client commands before benchmark
