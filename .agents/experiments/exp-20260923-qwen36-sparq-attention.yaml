schema: model-tuning-experiment/v1
id: exp-20260923-qwen36-sparq-attention
status: planned
decision: pending
hypothesis: >-
  SparQ query-dependent KV selection can reduce the measured Qwen3.6 GQA
  decode attention work enough to improve profiler-off TP4 output throughput.
  The first Ascend adaptation may select cache pages rather than individual
  tokens; that variant must be labelled separately from the paper algorithm.
objective: >-
  Find a HYPIC-independent, opt-in vLLM-Ascend plugin gain on Qwen3.6-27B.
  Require at least 10% reproducible end-to-end output-throughput improvement
  against the same-stack dense control, with TTFT/TPOT reported and final
  LongBench-v2/GSM8K task loss within the user-allowed 1% bound.
