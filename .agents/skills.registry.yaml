schema: mst/v1
name: generated-maintainer-skill-tree
authority: AGENTS.md
source_pack: repository-transformation-v0.1
profile: minimal

selection:
  default_strategy: smallest_relevant_set
  conflict_resolution:
    - Prefer narrower path scope.
    - Tool adapters do not override AGENTS.md or this registry.

skills:
  - id: chicaihong01-host-maintenance
    path: .agents/skills/chicaihong01-host-maintenance
    status: stable
    purpose: Enter and verify the canonical chicaihong01 maintenance environment through AWMCP from a fresh clone.
    triggers:
      - maintain code or run experiments on chicaihong01
      - connect a fresh clone to the target host
      - verify the canonical remote repository and Ascend machine state
    scope:
      - AGENTS.md
      - .agents/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
  - id: ascend-benchmark-evidence
    path: .agents/skills/ascend-benchmark-evidence
    status: experimental
    purpose: Produce comparable correctness and performance evidence on Ascend NPUs.
    triggers:
      - benchmark an inference change
      - compare an optimization with its baseline
      - accept or reject a performance claim
      - resume a task-accuracy evaluation after protocol changes
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-cannbot-profiler
    path: .agents/skills/ascend-cannbot-profiler
    status: experimental
    purpose: Use cannbot/CANN profiler and operator evidence to explain Ascend inference bottlenecks before low-level changes.
    triggers:
      - cannbot-skills
      - CANN profiler
      - Ascend operator profiling
      - msprof or asys analysis
      - kernel bottleneck on Ascend
      - HCCL communication analysis
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-inference-tuning-loop
    path: .agents/skills/ascend-inference-tuning-loop
    status: experimental
    purpose: Run the Git-recorded hypothesis-to-decision tuning flywheel.
    triggers:
      - start or resume an inference optimization
      - record a successful failed rejected or inconclusive attempt
      - close a tuning experiment
      - restart a reusable experiment container after mounted source changes
      - audit executable readiness or a process-observer failure in an Ascend preparation queue
      - organize independent parallel paper preparation and a serialized NPU validation DAG
      - define matched dense and candidate configurations for paper acceptance
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-npu-environment-orientation
    path: .agents/skills/ascend-npu-environment-orientation
    status: experimental
    purpose: Prove the exact Ascend hardware and software execution context.
    triggers:
      - establish or refresh a tuning baseline
      - move an experiment to another host or container
      - investigate environment or topology drift
    scope:
      - configs/**
      - scripts/**
      - .agents/experiments/**
  - id: paper-to-ascend
    path: .agents/skills/paper-to-ascend
    status: experimental
    purpose: Gate and translate a research paper into a bounded Ascend NPU inference optimization workstream.
    triggers:
      - Paper-to-Ascend
      - papertoAscend
      - adapt a paper to Ascend inference
      - implement a paper on Ascend
      - 论文迁移到 Ascend
      - 把论文方法落到 Ascend
      - validate stateful cache or replay correctness
      - debug AscendC state metadata corruption
      - reuse vllm-ascend or ops-transformer operators before custom Ascend kernels
      - close a time-boxed paper probe without promoting it to an end-to-end result
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
      - projects/**
