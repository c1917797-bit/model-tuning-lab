    path: .agents/skills/ascend-model-quality-evaluation
    status: experimental
    purpose: Produce reproducible paired Ascend quality evidence with mode-appropriate caps, applicable lossless or approximate criteria, and measured baseline variability.
    triggers:
      - test Ascend model accuracy or quality
      - compare baseline and candidate quality
      - validate quantization or optimization quality regression
      - Paper-to-Ascend quality gate
