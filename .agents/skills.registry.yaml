schema: mst/v1
name: generated-maintainer-skill-tree
authority: AGENTS.md
source_pack: repository-transformation-v0.1
profile: minimal

selection:
  default_strategy: smallest_relevant_set
  conflict_resolution:
    - Prefer narrower path scope.
    - Tool adapters do not override AGENTS.md or this registry.

skills:
  - id: chicaihong01-host-maintenance
    path: .agents/skills/chicaihong01-host-maintenance
    status: stable
    purpose: Enter and verify the canonical chicaihong01 maintenance environment through AWMCP from a fresh clone.
    triggers:
      - maintain code or run experiments on chicaihong01
      - connect a fresh clone to the target host
      - verify the canonical remote repository and Ascend machine state
      - distinguish active and historical container device claims
      - attribute changing NPU process ids to their live container workload
      - classify unknown-scope privileged containers and startup resource races
      - verify a rejected accelerator preflight left zero owned launch side effects
      - guard coherent idle-to-full transitions on a physically disjoint non-target lane
    scope:
      - AGENTS.md
      - .agents/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
  - id: ascend-benchmark-evidence
    path: .agents/skills/ascend-benchmark-evidence
    status: experimental
    purpose: Produce comparable Ascend evidence with correctness, E2E translation, and fail-fast progression gates.
    triggers:
      - benchmark an inference change
      - compare an optimization with its baseline
      - accept or reject a performance claim
      - translate an operator microbenchmark to service impact
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-cannbot-profiler
    path: .agents/skills/ascend-cannbot-profiler
    status: experimental
    purpose: Use cannbot/CANN critical-path and collective-lifecycle evidence before low-level Ascend changes.
    triggers:
      - cannbot-skills
      - CANN profiler
      - Ascend operator profiling
      - msprof or asys analysis
      - kernel bottleneck on Ascend
      - HCCL communication analysis
      - custom multi-rank collective lifecycle
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-inference-tuning-loop
    path: .agents/skills/ascend-inference-tuning-loop
    status: experimental
    purpose: Run the Git-recorded tuning flywheel with opportunity admission and closed-route learning.
    triggers:
      - start or resume an inference optimization
      - record a successful failed rejected or inconclusive attempt
      - close a tuning experiment
      - bound recoverable E2E opportunity before implementation
      - audit hybrid cache worker and scheduler lifecycle configuration
      - localize physical state-row and operator metadata binding failures
      - verify checkpoint-derived state inventories and Cartesian trace coverage
      - separate deterministic software readiness from volatile launch admission
      - adapt split K/V buffers with padded attention pages
      - stop performance after deterministic replay failure despite complete state transport
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-npu-environment-orientation
    path: .agents/skills/ascend-npu-environment-orientation
    status: experimental
    purpose: Prove the exact Ascend hardware and software execution context.
    triggers:
      - establish or refresh a tuning baseline
      - move an experiment to another host or container
      - investigate environment or topology drift
    scope:
      - configs/**
      - scripts/**
      - .agents/experiments/**
  - id: paper-ingestion
    path: .agents/skills/paper-ingestion
    status: experimental
    purpose: Extract a paper into implementable inference hypotheses and prerequisites before Ascend work begins.
    triggers:
      - ingest a paper for Ascend
      - paper mechanism extraction
      - read paper for implementation
      - 论文机制拆解
    scope:
      - docs/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-architecture-fit
    path: .agents/skills/ascend-architecture-fit
    status: experimental
    purpose: Verify whether a paper method fits the selected Ascend checkpoint, runtime, and serving stack.
    triggers:
      - architecture fit
      - checkpoint fit for paper
      - model mechanism verification
      - 架构适配
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-source-map
    path: .agents/skills/ascend-source-map
    status: experimental
    purpose: Map paper mechanisms to concrete vLLM, vLLM-Ascend, CANN, operator, launch, or system seams before editing.
    triggers:
      - map paper to source
      - find Ascend implementation seam
      - vLLM-Ascend source mapping
      - 论文到源码映射
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-canary-implementation
    path: .agents/skills/ascend-canary-implementation
    status: experimental
    purpose: Implement a minimal Ascend canary with exact runtime-path and per-process activation proof.
    triggers:
      - Ascend canary implementation
      - minimal paper implementation
      - one-variable inference canary
      - runtime monkeypatch activation proof
      - 最小可验证实现
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend-reproduction
    path: .agents/skills/paper-to-ascend-reproduction
    status: experimental
    purpose: Reproduce prior paper/practice results on Ascend with frozen one-switch A/B evidence and fail-closed audit.
    triggers:
      - paper reproduction on Ascend
      - historical benchmark reproduction
      - reproduce prior paper result
      - HYPIC reproduction
      - paper-to-ascend reproduction
      - state checkpoint compression or replay reproduction
      - 论文复现实验
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend-reporting
    path: .agents/skills/paper-to-ascend-reporting
    status: experimental
    purpose: Produce handoff-ready Paper-to-Ascend evidence reports with scoped decisions and next loops.
    triggers:
      - Paper-to-Ascend report
      - summarize paper implementation result
      - paper experiment handoff
      - 论文落地报告
    scope:
      - docs/**
      - .agents/HANDOFF.md
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend
    path: .agents/skills/paper-to-ascend
    status: experimental
    purpose: Gate and translate a complete, identity-labelled research method into a constraint-feasible Ascend NPU inference optimization workstream.
    triggers:
      - Paper-to-Ascend
      - papertoAscend
      - adapt a paper to Ascend inference
      - implement a paper on Ascend
      - 论文迁移到 Ascend
      - 把论文方法落到 Ascend
      - audit paper implementation completeness
      - distinguish paper-exact and derivative implementations
      - 论文方法链完整性核验
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
