schema: mst/v1
name: generated-maintainer-skill-tree
authority: AGENTS.md
source_pack: repository-transformation-v0.1
profile: minimal

selection:
  default_strategy: smallest_relevant_set
  conflict_resolution:
    - Prefer narrower path scope.
    - Tool adapters do not override AGENTS.md or this registry.

skills:
  - id: chicaihong01-host-maintenance
    path: .agents/skills/chicaihong01-host-maintenance
    status: stable
    purpose: Enter and verify the canonical chicaihong01 maintenance environment through AWMCP from a fresh clone.
    triggers:
      - maintain code or run experiments on chicaihong01
      - connect a fresh clone to the target host
      - verify the canonical remote repository and Ascend machine state
      - distinguish active and historical container device claims
    scope:
      - AGENTS.md
      - .agents/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
  - id: ascend-benchmark-evidence
    path: .agents/skills/ascend-benchmark-evidence
    status: experimental
    purpose: Produce comparable Ascend evidence with correctness, E2E translation, and fail-fast progression gates.
    triggers:
      - benchmark an inference change
      - compare an optimization with its baseline
      - accept or reject a performance claim
      - translate an operator microbenchmark to service impact
      - audit percentile definitions or smoke versus formal activation gates
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-model-quality-evaluation
    path: .agents/skills/ascend-model-quality-evaluation
    status: experimental
    purpose: Produce reproducible paired Ascend model-quality evidence with a 2048-token quality cap and measured baseline variability.
    triggers:
      - test Ascend model accuracy or quality
      - compare baseline and candidate quality
      - validate quantization or optimization quality regression
      - Paper-to-Ascend quality gate
      - 精度测试
      - 质量回归测试
      - audit shared-NPU isolation during a paired quality suite
      - verify conditional treatment hot-path coverage before a quality suite
      - stress materialized hot-path replay at target concurrency before full quality evaluation
    scope:
      - AGENTS.md
      - configs/**
      - scripts/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-cannbot-profiler
    path: .agents/skills/ascend-cannbot-profiler
    status: experimental
    purpose: Use cannbot/CANN critical-path and collective-lifecycle evidence before low-level Ascend changes.
    triggers:
      - cannbot-skills
      - CANN profiler
      - Ascend operator profiling
      - msprof or asys analysis
      - kernel bottleneck on Ascend
      - HCCL communication analysis
      - custom multi-rank collective lifecycle
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-inference-tuning-loop
    path: .agents/skills/ascend-inference-tuning-loop
    status: experimental
    purpose: Run the Git-recorded tuning flywheel with opportunity admission and closed-route learning.
    triggers:
      - start or resume an inference optimization
      - record a successful failed rejected or inconclusive attempt
      - close a tuning experiment
      - bound recoverable E2E opportunity before implementation
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
  - id: ascend-npu-environment-orientation
    path: .agents/skills/ascend-npu-environment-orientation
    status: experimental
    purpose: Prove the exact Ascend hardware and software execution context.
    triggers:
      - establish or refresh a tuning baseline
      - move an experiment to another host or container
      - investigate environment or topology drift
    scope:
      - configs/**
      - scripts/**
      - .agents/experiments/**
  - id: paper-ingestion
    path: .agents/skills/paper-ingestion
    status: experimental
    purpose: Extract a paper into implementable inference hypotheses and prerequisites before Ascend work begins.
    triggers:
      - ingest a paper for Ascend
      - paper mechanism extraction
      - read paper for implementation
      - 论文机制拆解
      - bounded paper implementation audit
      - 论文实现范围核验
    scope:
      - docs/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-architecture-fit
    path: .agents/skills/ascend-architecture-fit
    status: experimental
    purpose: Verify whether a paper method fits the selected Ascend checkpoint, runtime, and serving stack.
    triggers:
      - architecture fit
      - checkpoint fit for paper
      - model mechanism verification
      - 架构适配
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-source-map
    path: .agents/skills/ascend-source-map
    status: experimental
    purpose: Map paper mechanisms to concrete vLLM, vLLM-Ascend, CANN, operator, launch, or system seams before editing.
    triggers:
      - map paper to source
      - find Ascend implementation seam
      - vLLM-Ascend source mapping
      - 论文到源码映射
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-canary-implementation
    path: .agents/skills/ascend-canary-implementation
    status: experimental
    purpose: Implement a minimal Ascend canary with exact runtime-path and per-process activation proof.
    triggers:
      - Ascend canary implementation
      - minimal paper implementation
      - one-variable inference canary
      - runtime monkeypatch activation proof
      - 最小可验证实现
    scope:
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: ascend-performance-optimization
    path: .agents/skills/ascend-performance-optimization
    status: experimental
    purpose: Convert measured Ascend inference bottlenecks into bounded one-variable optimization candidates across compute, memory, scheduling, communication, compilation, and lifecycle paths.
    triggers:
      - optimize Ascend inference performance
      - turn profiler evidence into an optimization
      - choose or implement a performance treatment
      - Dense MoE or MTP performance optimization
      - Ascend 性能优化
      - 根据瓶颈实施优化
      - isolate a common CPU-binding Decode floor from the paper technique effect
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - projects/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: runtime-monkeypatch-delivery
    path: .agents/skills/runtime-monkeypatch-delivery
    status: experimental
    purpose: Package local inference-runtime changes as removable, hash-bound monkeypatches with per-worker activation, rollback, and promotion evidence.
    triggers:
      - deliver a new inference runtime technique
      - package an Ascend monkeypatch or runtime plugin
      - validate monkeypatch activation rollback or promotion
      - runtime monkeypatch delivery
      - 新技术 monkeypatch 交付
      - 可移除运行时补丁
    scope:
      - AGENTS.md
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - projects/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend-reproduction
    path: .agents/skills/paper-to-ascend-reproduction
    status: experimental
    purpose: Reproduce prior paper/practice results on Ascend with frozen one-switch A/B evidence and fail-closed audit.
    triggers:
      - paper reproduction on Ascend
      - historical benchmark reproduction
      - reproduce prior paper result
      - HYPIC reproduction
      - paper-to-ascend reproduction
      - 论文复现实验
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend-reporting
    path: .agents/skills/paper-to-ascend-reporting
    status: experimental
    purpose: Render measured Paper-to-Ascend experiments as colleague-style, evidence-bound, reproducible reports without inventing data.
    triggers:
      - Paper-to-Ascend report
      - summarize paper implementation result
      - paper experiment handoff
      - 论文落地报告
      - write a Paper-to-Ascend report
      - summarize an algorithm-piercing experiment
      - produce a paper reproduction report
      - 输出论文穿刺报告
      - 按同事实践格式汇报实测结果
    scope:
      - docs/**
      - .agents/HANDOFF.md
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: paper-to-ascend
    path: .agents/skills/paper-to-ascend
    status: experimental
    purpose: Gate and translate a complete, identity-labelled research method into a constraint-feasible Ascend NPU inference optimization workstream.
    triggers:
      - Paper-to-Ascend
      - papertoAscend
      - adapt a paper to Ascend inference
      - implement a paper on Ascend
      - 论文迁移到 Ascend
      - 把论文方法落到 Ascend
      - audit paper implementation completeness
      - distinguish paper-exact and derivative implementations
      - 论文方法链完整性核验
    scope:
      - AGENTS.md
      - docs/**
      - configs/**
      - scripts/**
      - src/**
      - tests/**
      - .agents/experiments/**
      - .agents/workstreams/**
  - id: mst-agentsmd-authoring
    path: .agents/skills/mst-agentsmd-authoring
    status: stable
    purpose: Write or revise a short AGENTS.md bootstrap for a target repository without duplicating Skill content.
    triggers:
      - create AGENTS.md for a target repository
      - revise a target repository AGENTS.md bootstrap
    scope:
      - AGENTS.md
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - CLAUDE.md
      - .opencode/**
      - .codex/**
      - .cursor/**
  - id: mst-experience-ingestion
    path: .agents/skills/mst-experience-ingestion
    status: stable
    purpose: Turn verified maintenance experience into the smallest reusable Skill, registry, eval, or adapter change.
    triggers:
      - ingest lessons after a real repository maintenance session
      - classify a repeated maintainer failure into durable guidance
      - preserve a verified audit correction for future iterations
    scope:
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - .agents/evals/**
      - examples/**
      - AGENTS.md
      - CLAUDE.md
  - id: mst-git-checkpoint-policy
    path: .agents/skills/mst-git-checkpoint-policy
    status: stable
    purpose: Apply the confirmed repository commit-and-push policy to coherent validated checkpoints.
    triggers:
      - choose or codify a repository Git checkpoint policy
      - decide whether validated work may commit or push
      - checkpoint a named workstream branch after validation
    scope:
      - AGENTS.md
      - .agents/git-policy.yaml
      - .agents/workstreams/**
      - scripts/validate-mst.sh
  - id: mst-loop-engineering-framework
    path: .agents/skills/mst-loop-engineering-framework
    status: stable
    purpose: Design or maintain a Git-backed, non-drifting agent loop with durable state and independent verification.
    triggers:
      - design a Git-backed maintainer loop across sessions
      - repair a loop that drifts from its bounded objective
      - add maker-checker validation and handoff to an autonomous loop
    scope:
      - AGENTS.md
      - .agents/**
      - agents/**
      - scripts/**
  - id: mst-maintainer-handoff
    path: .agents/skills/mst-maintainer-handoff
    status: stable
    purpose: Keep integrated and branch-local maintainer handoffs current, concise, and evidence-bound.
    triggers:
      - update or validate the maintainer HANDOFF
      - prepare a branch-local task for agent takeover
      - close a non-trivial maintainer turn with a resume point
    scope:
      - AGENTS.md
      - .agents/HANDOFF.md
      - .agents/workstreams/**
  - id: mst-parallel-workstreams
    path: .agents/skills/mst-parallel-workstreams
    status: experimental
    purpose: Route non-trivial work to named remote branches and serialize evidence-bound integration and safe reclamation.
    triggers:
      - start or resume a non-trivial named workstream
      - integrate a workstream with drift or resource claims
      - reclaim a completed or superseded worktree
      - decide whether a change qualifies for direct-primary work
    scope:
      - AGENTS.md
      - .agents/**
      - configs/**
      - docs/**
      - projects/**
      - scripts/**
      - src/**
      - tests/**
  - id: mst-practice-iteration-planning
    path: .agents/skills/mst-practice-iteration-planning
    status: stable
    purpose: Decompose a validation stage into small iterations with machine-checkable pass criteria and lesson destinations.
    triggers:
      - plan a validation stage for a target repository
      - decompose a practice goal into verifiable iterations
      - decide the next practice validation step
    scope:
      - .agents/evals/practice-iterations/**
      - .agents/workstreams/**
      - docs/**
  - id: mst-repo-onboarding
    path: .agents/skills/mst-repo-onboarding
    status: stable
    purpose: Re-orient a maintainer to the repository structure, Skill Tree, task state, and validation before changes.
    triggers:
      - first enter this repository as a maintainer
      - resume a maintainer session after a checkpoint
      - reorient after Skill Tree structural changes
    scope:
      - AGENTS.md
      - .agents/**
      - docs/**
      - agents/**
      - CLAUDE.md
      - scripts/validate-mst.sh
  - id: mst-repo-transformation
    path: .agents/skills/mst-repo-transformation
    status: stable
    purpose: Convert an ordinary repository into an AGENTS.md and Maintainer Skill Tree system.
    triggers:
      - transform a repository into an agent-maintained repository
      - migrate tool-specific rules into AGENTS.md and maintainer Skills
    scope:
      - AGENTS.md
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - CLAUDE.md
      - .opencode/**
      - .codex/**
      - .cursor/**
      - scripts/validate-mst.sh
  - id: mst-runtime-skill-boundary
    path: .agents/skills/mst-runtime-skill-boundary
    status: stable
    purpose: Keep product runtime Skills separate from maintainer Skills and verify publication and permission boundaries.
    triggers:
      - separate runtime product Skills from maintainer Skills
      - audit tenant-facing Skill visibility or publication policy
    scope:
      - AGENTS.md
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - runtime-skills/**
  - id: mst-skill-governor
    path: .agents/skills/mst-skill-governor
    status: stable
    purpose: Govern evidence-based updates, additions, deprecations, and restructuring of maintainer Skills.
    triggers:
      - add or revise a Maintainer Skill from verified experience
      - deprecate or retire an obsolete Maintainer Skill
      - update Skill registry metadata after a Skill change
    scope:
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - .agents/evals/**
      - templates/skills/**
  - id: mst-skill-tree-design
    path: .agents/skills/mst-skill-tree-design
    status: stable
    purpose: Design a minimal Maintainer Skill Tree and justify any path-specific additions.
    triggers:
      - design the first Maintainer Skill Tree for a repository
      - justify adding a path-specific maintainer Skill
    scope:
      - AGENTS.md
      - .agents/skills.registry.yaml
      - .agents/skills/**
      - templates/skills/**
  - id: mst-tool-adapter-boundary
    path: .agents/skills/mst-tool-adapter-boundary
    status: stable
    purpose: Keep coding-tool adapters thin and subordinate to AGENTS.md and the Maintainer Skill Tree.
    triggers:
      - add or update a coding-tool adapter
      - resolve an adapter conflict with canonical maintainer instructions
    scope:
      - AGENTS.md
      - .agents/skills.registry.yaml
      - CLAUDE.md
      - .cursorrules
      - .cursor/**
      - .opencode/**
      - .codex/**
  - id: mst-transformation-verification
    path: .agents/skills/mst-transformation-verification
    status: stable
    purpose: Verify AGENTS, registry, Skill structure, and maintainer/runtime boundaries after transformation.
    triggers:
      - verify changed AGENTS.md or Maintainer Skill Tree
      - audit multi-level registry and maintainer-runtime boundaries
    scope:
      - AGENTS.md
      - .agents/**
      - CLAUDE.md
      - runtime-skills/**
      - scripts/validate-mst.sh
