display_name: Tech Company Report PPT
short_description: Turn a topic into an internal report PPT with editable titles, tables, matrices, key metrics, and conclusions.
default_prompt: Create a technology-company internal report PPT from my topic. Keep tables, matrices, roadmaps, KPI grids, legends, key numbers, titles, and conclusions editable; use image2 only for complex diagrams or source imagery; export a contact sheet for review.
