[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tuning-lab"
version = "0.1.0"
description = "Model tuning, inference optimization, and evaluation experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
host-test = [
    "numpy>=1.26,<3",
    "pytest>=8,<9",
    "torch==2.4.1",
]

[project.entry-points."vllm.general_plugins"]
sliminfer_ascend = "sliminfer_ascend:register"
tail_replay_ascend = "tail_replay_ascend:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
