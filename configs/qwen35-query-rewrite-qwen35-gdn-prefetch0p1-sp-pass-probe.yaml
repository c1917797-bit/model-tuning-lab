schema: qwen35-query-rewrite-runtime/v1
model: /cache/austinov/Qwen3.8-27B
served_model_name: Qwen3-5/Qwen3.5-27B
host: 127.0.0.1
port: 10010
environment:
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
  HCCL_BUFFSIZE: "512"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  VLLM_ASCEND_ENABLE_MATMUL_ALLREDUCE: "1"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"
  VLLM_ASCEND_ENABLE_NZ: "1"
  VLLM_ASCEND_PTO_CHUNK_GDN: "1"
  VLLM_LOGGING_LEVEL: DEBUG
serve:
  data_parallel_size: 1
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  seed: 1024
  max_num_seqs: 16
  max_model_len: 133000
  max_num_batched_tokens: 32768
  trust_remote_code: true
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  mamba_cache_mode: align
  mamba_cache_dtype: bfloat16
  mamba_ssm_cache_dtype: bfloat16
  async_scheduling: true
  quantization: null
  speculative_config: null
  additional_config:
    enable_cpu_binding: true
    enable_matmul_allreduce: true
    enable_flashcomm1: false
    weight_nz_mode: 1
    weight_prefetch_config:
      enabled: true
      prefetch_ratio:
        attn: {qkv: 0.0, o: 0.0}
        moe: {gate_up: 0.0}
        mlp: {gate_up: 0.1, down: 0.0}
  default_chat_template_kwargs:
    enable_thinking: false
  compilation_config:
    cudagraph_mode: FULL_DECODE_ONLY
    cudagraph_capture_sizes: [1, 2, 4, 6, 8, 10, 12, 14, 16, 32, 64, 128, 256, 384, 512, 640, 768, 896, 1024, 1280, 1536, 1792, 2048, 2304, 2560, 2816, 3072, 3328, 3456, 3584]
    pass_config:
      enable_sp: true
      sp_min_token_num: 1
probe:
  purpose: "prove whether the built-in Ascend sequence-parallel graph pass matches Qwen3.5 while retained MMAR remains enabled"
  expected_runtime_log:
    - "speculative_config=None"
    - "enable_sp=True"
    - "sp_min_token_num=1"
    - "Replaced <count> patterns"
  fail_fast_rule: "if every SequenceParallelismPass invocation reports zero replacements, reject without an E2E matrix"
candidate:
  id: bf16-mmar-qwen35-gdn-prefetch0p1-sp-pass-probe
  dtype: bfloat16
  quantized: false
  speculative_decoding: false
  physical_devices: [0, 1, 2, 3]
  primary_variable: "enable built-in Ascend sequence-parallel compiler pass at one token while retaining MMAR"
