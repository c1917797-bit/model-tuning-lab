schema: qwen35-query-rewrite-runtime/v1
role: user_reconstructed_tp8_baseline
model: /cache/austinov/Qwen3.8-27B
served_model_name: Qwen3-5/Qwen3.5-27B
runtime:
  image: quay.io/ascend/vllm-ascend:v0.23.0
  dtype: bfloat16
  quantization: null
  tensor_parallel_size: 8
  pipeline_parallel_size: 1
  data_parallel_size: 1
  decode_context_parallel_size: 1
  disable_custom_all_reduce: true
  max_model_len: 133000
  max_num_seqs: 16
  max_num_batched_tokens: 32768
  seed: 1024
  enable_prefix_caching: true
  enable_chunked_prefill: true
  async_scheduling: true
  mamba_cache_mode: align
  mamba_cache_dtype: bfloat16
  mamba_ssm_cache_dtype: bfloat16
  speculative_config: null
  compilation_config:
    mode: 3
    custom_ops: [all]
    ir_enable_torch_wrap: false
    splitting_ops: []
    compile_sizes: []
    cudagraph_mode: FULL_DECODE_ONLY
    compile_ranges_endpoints: [8096]
    cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32]
    cudagraph_num_of_warmups: 1
    max_cudagraph_capture_size: 32
    use_inductor_graph_partition: false
    inductor_compile_config:
      enable_auto_functionalized_v2: false
      size_asserts: false
      alignment_asserts: false
      scalar_asserts: false
      combo_kernels: true
      benchmark_combo_kernel: true
    pass_config:
      fuse_norm_quant: true
      fuse_act_quant: true
      fuse_attn_quant: false
      enable_sp: false
      fuse_gemm_comms: false
      fuse_allreduce_rms: false
      fuse_rope_kvcache_cat_mla: false
      fuse_act_padding: false
    dynamic_shapes_config:
      type: backed
      evaluate_guards: false
      assume_32_bit_indexing: false
    fast_moe_cold_start: true
    static_all_moe_layers: []  # effective default; not accepted as a CLI input
  additional_config:
    enable_cpu_binding: true
    enable_matmul_allreduce: true
    enable_flashcomm1: false
environment:
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  HCCL_BUFFSIZE: "512"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  TRITON_KERNEL_DUMP: "1"
  TRITON_DUMP_DIR: /cache/efim/triton_dump
  VLLM_ASCEND_ENABLE_MATMUL_ALLREDUCE: "1"
  VLLM_LOGGING_LEVEL: DEBUG
benchmark:
